<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fysi MVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE calm clinical-warm, readable for 25 and 85 year olds alike
   IDEA the physio's home-exercise sheet made alive; one loop between clinic and kitchen floor
   PICTURE animated line figures per exercise; deep-teal week card; pain map front/back
   COLOUR Figma palette: warm paper ground, deep teal lead, amber for progress/limits, coral for pain, soft teal fields
   TYPE Plus Jakarta Sans 800 titles, 500 text; large base, A/A+/A++
   LAYOUT patient = phone column, bottom tabs; physio = sidebar + content, stacks under 900px */
:root{color-scheme:light dark;
--bg:light-dark(#f6f4ef,#0d1514);--card:light-dark(#ffffff,#15201f);--ink:light-dark(#1a2423,#e9efed);--mut:light-dark(#56625f,#a3b4b0);
--t:light-dark(#0f4c4a,#62c7b8);--hero:light-dark(#0f4c4a,#10403d);--btn:light-dark(#0f4c4a,#62c7b8);--onbtn:light-dark(#ffffff,#06201d);
--tl:light-dark(#eef7f5,#142b29);--tl2:light-dark(#d6ece8,#1d3b38);--line:light-dark(#e6e1d7,#263533);
--ok:light-dark(#2e7d4f,#62d193);--oks:light-dark(#e2f2e7,#14301f);
--am:light-dark(#e9a23b,#f0b354);--ami:light-dark(#8a5806,#f3c06a);--ams:light-dark(#fdf3e1,#33280f);
--co:light-dark(#c8483a,#ff8a78);--cos:light-dark(#f8e1de,#3a1d18);
--in:light-dark(#2f5597,#9fbaf0);--ins:light-dark(#e3ecf8,#1b2433)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{font-size:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 1.0625rem/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
h1,h2,h3,h4{line-height:1.15;letter-spacing:-.02em;margin:0;text-wrap:balance}
h1{font-size:clamp(1.9rem,4vw,2.5rem);font-weight:800}
h2{font-size:1.45rem;font-weight:800}
h3{font-size:1.15rem;font-weight:700}
h4{font-size:1.05rem;font-weight:700}
p{margin:.3em 0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--am);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:8px max(3vw,16px);border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.4rem;color:var(--t);text-decoration:none;letter-spacing:-.03em}
.logo{width:32px;height:32px;border-radius:9px;background:var(--hero);display:grid;place-items:center}
.roles{display:flex;flex-wrap:wrap;gap:4px;background:var(--bg);padding:4px;border-radius:14px}
.roles a{padding:8px 14px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:700;min-height:44px;display:flex;align-items:center}
.roles a[aria-current=page]{background:var(--btn);color:var(--onbtn)}
@media(max-width:560px){.fs span{display:none}.top{gap:6px}.roles a{padding:6px 10px;min-height:40px}}
.fs{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:.9rem;color:var(--mut)}
.fs button{border:1px solid var(--line);background:var(--card);border-radius:10px;min-width:44px;min-height:44px;font-weight:800}
.fs button[aria-pressed=true]{border-color:var(--t);background:var(--tl);color:var(--t)}
main{min-height:70vh}
.wrap{max-width:1280px;margin:0 auto;padding:24px max(3vw,16px) 40px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:700;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--btn);border-color:var(--btn);color:var(--onbtn)}
.btn.co{background:var(--co);border-color:var(--co);color:#fff}
.btn.sm{min-height:42px;padding:6px 12px;font-size:.93rem}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{flex:none;width:20px;height:20px}
.notice>svg{width:22px;height:22px;color:var(--mut)}
.link{background:none;border:0;color:var(--t);font-weight:700;text-decoration:underline;padding:8px 4px;min-height:44px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.mut{color:var(--mut)}
.small{font-size:.9rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;min-height:44px;font-weight:700}
.chip[aria-pressed=true]{background:var(--btn);border-color:var(--btn);color:var(--onbtn)}
.tag{display:inline-flex;align-items:center;gap:5px;background:var(--tl);color:var(--t);border-radius:999px;padding:3px 10px;font-size:.82rem;font-weight:700;white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.plain::before{display:none}
.tag.co{background:var(--cos);color:var(--co)}
.tag.am{background:var(--ams);color:var(--ami)}
.tag.ok{background:var(--oks);color:var(--ok)}
.tag.in{background:var(--ins);color:var(--in)}
.av{width:44px;height:44px;border-radius:50%;background:var(--tl2);color:var(--t);display:grid;place-items:center;font-weight:800;flex:none}
.note{border-radius:14px;padding:12px 14px;background:var(--ams)}
.note.in{background:var(--ins)}.note.tl{background:var(--tl)}.note.ok{background:var(--oks)}.note.co{background:var(--cos)}
/* start */
.start{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;margin-top:22px}
.start a{display:grid;gap:10px;padding:24px;border-radius:22px;text-decoration:none;color:var(--ink);border:1.5px solid var(--line);background:var(--card)}
.start a:hover{border-color:var(--t)}
.start a.hero{background:var(--hero);color:#fff;border-color:var(--hero)}
.start .art{height:150px;background:var(--tl);border-radius:14px;display:grid;place-items:center;color:var(--t)}
.start a.hero .art{background:rgba(255,255,255,.1)}
.start a.hero .exfig line,.start a.hero .exfig circle{stroke:#fff}.start a.hero .exfig circle{fill:var(--hero)}
/* figures */
.exfig{width:100%;height:100%;display:block}
.exfig .ghost{opacity:.2}
.exfig line{stroke:var(--t);stroke-width:7;stroke-linecap:round;fill:none}
.exfig circle{fill:var(--tl);stroke:var(--t);stroke-width:6}
.exfig .prop{stroke:var(--mut);stroke-width:3;opacity:.5;fill:none}
.pic{background:var(--tl);border-radius:12px;aspect-ratio:4/3}
/* patient phone */
.phone{max-width:480px;margin:18px auto 30px;border:1px solid var(--line);border-radius:30px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;min-height:min(840px,calc(100svh - 110px))}
@media(max-width:560px){.phone{margin:0;border:0;border-radius:0;min-height:calc(100svh - 64px)}}
.phead{padding:18px 18px 6px;display:grid;gap:4px}
.phead select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px;min-height:40px}
.pbody{flex:1;padding:12px 16px 18px;display:grid;gap:14px;align-content:start}
.pnav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--card)}
.pnav button{border:0;background:none;padding:8px 4px 12px;display:grid;justify-items:center;gap:2px;font-weight:700;font-size:.9rem;color:var(--mut);min-height:66px;position:relative}
.pnav button span.ic{display:grid;place-items:center;width:56px;height:32px;border-radius:999px}
.pnav button[aria-current=true]{color:var(--t)}
.pnav button[aria-current=true] span.ic{background:var(--tl2)}
.pnav svg{width:24px;height:24px}
.badge{position:absolute;top:4px;left:calc(50% + 12px);background:var(--co);color:#fff;border-radius:999px;font-size:.75rem;padding:0 6px;min-width:20px}
.herocard{background:var(--hero);color:#fff;border-radius:22px;padding:18px 18px 16px;display:grid;gap:10px}
.herocard .pill{background:var(--am);color:#2a1a00;border-radius:999px;padding:3px 10px;font-size:.82rem;font-weight:800;white-space:nowrap}
.big{font-size:2.4rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.prog{height:8px;border-radius:8px;background:rgba(255,255,255,.18);overflow:hidden}
.prog i{display:block;height:100%;background:var(--am);border-radius:8px}
.dots{display:flex;flex-wrap:wrap;gap:8px}
.dots i{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.45);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:.85rem}
.dots i.on{background:#fff;border-color:#fff;color:var(--hero)}
.dots svg{width:18px;height:18px}
.exrow{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;text-align:left;width:100%}
.exrow .go{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--mut)}
.exrow .go.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.exrow .go svg{width:18px;height:18px}
.dose{font-size:.95rem;color:var(--mut);font-weight:600}
.notice{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--ams);border:1px solid color-mix(in srgb,var(--am) 45%,transparent);border-radius:16px;padding:12px 14px;text-align:left;width:100%;color:var(--ink)}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:4px}
/* modal */
.back{position:fixed;inset:0;background:rgba(8,20,18,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.back{align-items:center;padding:20px}}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:94svh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px 22px;display:grid;gap:12px}
@media(min-width:700px){.sheet{border-radius:24px}}
.sheet>header{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:-18px;background:var(--bg);padding:6px 0;z-index:2}
.sheet .card{padding:16px}
.x{border:1px solid var(--line);background:var(--card);border-radius:999px;width:48px;height:48px;font-size:1.5rem;line-height:1;flex:none}
.bigfig{background:var(--tl);border-radius:18px;aspect-ratio:16/10}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:10px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start;font-size:1.08rem}
ol.steps li::before{content:counter(s);width:32px;height:32px;border-radius:50%;background:var(--tl2);color:var(--t);display:grid;place-items:center;font-weight:800}
.dodont{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;border-radius:12px;padding:10px 12px}
.dodont b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:.9rem}
.quote{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stepper{display:inline-flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px}
.stepper button{width:44px;height:44px;border-radius:10px;border:0;background:var(--card);font-size:1.35rem;font-weight:700}
.stepper output{min-width:2.6em;text-align:center;font-size:1.2rem;font-weight:800;font-variant-numeric:tabular-nums}
.lex{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.lex:first-of-type{border-top:0}
.lex.flagged{background:var(--ams);border-radius:12px;padding:12px;border:0}
.vas{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px}
@media(max-width:440px){.vas{grid-template-columns:repeat(6,minmax(0,1fr))}}
.vas button{min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:800;font-size:1.1rem;box-shadow:inset 0 -5px 0 var(--c)}
.vas button[aria-pressed=true]{background:var(--c);border-color:var(--c);color:#13201a;box-shadow:none;transform:scale(1.06)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{border:0;background:none;border-radius:10px;min-height:46px;font-weight:700;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--t);box-shadow:0 1px 3px rgba(0,0,0,.12)}
textarea,input[type=text],input[type=search],input[type=date]{width:100%;font-size:1rem;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:var(--card)}
textarea{min-height:90px;resize:vertical}
.dinp{max-width:240px;min-height:48px}
label.lab{font-weight:700;display:block;margin-bottom:6px}
details.more summary{cursor:pointer;font-weight:700;color:var(--t);min-height:44px;display:flex;align-items:center}
/* pain module */
.bodymap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
.body{height:auto;max-width:100%;flex:none}
.reg{fill:transparent;stroke:var(--co);stroke-width:2;stroke-dasharray:3 3;cursor:pointer}
.reg:hover{fill:var(--cos)}
.reg[aria-pressed=true]{fill:var(--co);stroke-dasharray:none}
.reg:focus-visible{outline:none;stroke-width:4;stroke-dasharray:none}
.body .lr{font-size:14px;font-weight:800;fill:var(--mut)}
.picker{display:grid;gap:12px;margin-top:10px}
.zoom{display:grid;gap:6px}
.zwrap{display:grid;gap:12px}
.zlist{grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr))}
.zfig{height:min(360px,55vh);width:auto;max-width:100%;justify-self:center;background:var(--tl);border-radius:14px}
.zwrap>.zfig{grid-column:1/-1}
.zone{cursor:pointer}
.zone ellipse{fill:var(--card);fill-opacity:.9;stroke:var(--co);stroke-width:2}
.zone text{fill:var(--co);font-weight:800;pointer-events:none}
.zone[aria-pressed=true] ellipse{fill:var(--co);fill-opacity:1}
.zone[aria-pressed=true] text{fill:#fff}
.zone:focus-visible{outline:none}.zone:focus-visible ellipse{stroke-width:4}
.zlist{display:grid;gap:6px;align-content:start}
.zchip{display:flex;gap:8px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:6px 10px;min-height:44px;font-weight:600}
.zchip b{width:24px;height:24px;border-radius:50%;background:var(--cos);color:var(--co);display:grid;place-items:center;font-size:.8rem;flex:none}
.zchip[aria-pressed=true]{border-color:var(--co);background:var(--cos)}
.zchip[aria-pressed=true] b{background:var(--co);color:#fff}
.ptiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:8px;margin-top:8px}
.ptile{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;text-align:left;padding:10px 12px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);min-height:60px}
.ptile small{display:block;color:var(--mut);font-size:.85rem;line-height:1.3}
.ptile .picon,.ptag .picon{color:var(--co);flex:none}
.ptile[aria-pressed=true]{border-color:var(--co);background:var(--cos)}
.pcard{background:var(--card);color:var(--ink);border-radius:12px;padding:10px;margin-top:8px;display:grid;gap:8px;border:1px solid var(--line)}
.vasb{font-weight:800;border-radius:8px;padding:3px 10px;color:#13201a;font-size:.9rem;white-space:nowrap}
.ptag{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.ppic{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
/* messages */
.thread{display:grid;gap:10px}
.msg{max-width:86%;padding:10px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.msg.me{justify-self:end;background:var(--hero);border-color:var(--hero);color:#fff;border-bottom-right-radius:4px}
.msg.them{border-bottom-left-radius:4px}
.msg time{display:block;font-size:.78rem;opacity:.75;margin-top:2px}
.msg img{max-width:100%;border-radius:10px;margin-top:6px;display:block}
.quick{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.quick .chip{flex:none}
.quota{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.quota i{width:14px;height:14px;border-radius:50%;background:var(--t);display:inline-block}
.quota i.used{background:var(--line)}
/* charts and calendars */
.fig{position:relative;min-height:200px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.fig text{font-size:13px;fill:var(--mut);paint-order:stroke;stroke:var(--card);stroke-width:4px}
.wk{display:flex;flex-wrap:wrap;gap:10px}
.wk div{display:grid;justify-items:center;gap:4px;font-size:.82rem;color:var(--mut);font-weight:700}
.wk i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;border:1.5px solid var(--line);background:var(--bg);color:var(--mut)}
.wk i.full{background:var(--ok);border-color:var(--ok);color:#fff}
.wk i.part{background:var(--am);border-color:var(--am);color:#2a1a00}
.wk i.now{border:2px solid var(--t);color:var(--t)}
.wk svg{width:18px;height:18px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.85rem;color:var(--mut)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px}
.wbars{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px;align-items:end;height:150px;margin-top:10px}
.wbars div{display:grid;grid-template-rows:auto 1fr auto;height:100%;text-align:center;font-size:.8rem;color:var(--mut);font-weight:700;gap:4px}
.wbars .col{position:relative;border:1.5px dashed var(--line);border-radius:8px;overflow:hidden}
.wbars .col i{position:absolute;left:0;right:0;bottom:0;background:var(--t);border-radius:6px 6px 0 0}
.wbars .col i.low{background:var(--am)}
.meter{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--t);border-radius:8px}
.meter i.low{background:var(--am)}.meter i.bad{background:var(--co)}
/* physio */
.fshell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100svh - 64px)}
.side{background:var(--card);border-right:1px solid var(--line);padding:18px 12px;display:grid;align-content:start;gap:4px}
.side button{display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:12px;padding:10px 12px;font-weight:700;text-align:left;min-height:46px;color:var(--ink)}
.side button[aria-current=true]{background:var(--btn);color:var(--onbtn)}
.side button .n{margin-left:auto;background:var(--tl2);color:var(--t);border-radius:999px;font-size:.78rem;padding:0 8px}
.side svg{width:20px;height:20px;flex:none}
.side .who{margin-top:18px;padding:12px;border-radius:12px;background:var(--tl);font-size:.88rem}
@media(max-width:900px){.fshell{grid-template-columns:minmax(0,1fr)}.side{border-right:0;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;padding:8px 12px}.side .who,.side .brandrow{display:none}.side button{flex:none}}
.fmain{padding:24px max(2.5vw,16px) 40px;display:grid;gap:18px;align-content:start;max-width:1240px;width:100%}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px}
.kpi{border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--card);display:grid;gap:2px}
.kpi .ki{width:34px;height:34px;border-radius:10px;background:var(--tl);color:var(--t);display:grid;place-items:center;margin-bottom:6px}
.kpi .ki svg{width:18px;height:18px}
.kpi strong{font-size:2rem;line-height:1.1;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.g2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media(max-width:1100px){.g3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.g3>:last-child{grid-column:1/-1}}
@media(max-width:800px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
.att{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px 12px}

.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:2px solid var(--line)}

.flagrow{border-radius:12px;padding:10px 12px;background:var(--cos);display:grid;gap:4px}

.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;max-height:620px;overflow:auto;padding:2px}

<script>
{
/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const TODAY=new Date();TODAY.setHours(12,0,0,0);
const TK=key(TODAY);
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fromKey=k=>{const a=k.split('-').map(Number);return new Date(a[0],a[1]-1,a[2],12)};
const dow=d=>(d.getDay()+6)%7;
const MON=['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];
const MONL=['januari','februari','mars','april','maj','juni','juli','augusti','september','oktober','november','december'];
const DAY=['Mån','Tis','Ons','Tor','Fre','Lör','Sön'];
const DAYL=['måndag','tisdag','onsdag','torsdag','fredag','lördag','söndag'];
const fmt=d=>d.getDate()+' '+MON[d.getMonth()];
const fmtL=d=>DAYL[dow(d)]+' '+d.getDate()+' '+MONL[d.getMonth()];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const hm=t=>{const d=new Date(t);return fmt(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes())};

/* ---------- exercise library ---------- */
const EX=[
{id:'knaboj',name:'Knäböj mot stol',area:'Knä & höft',unit:'rep',pose:'squat',tags:'knä lår säte ben squat böj sitta resa uppresning',steps:['Stå med fötterna axelbrett isär, med en stol bakom dig.','Böj på knän och höft som om du ska sätta dig. Håll ryggen rak.','Nudda stolen lätt med baken och res dig långsamt upp igen.'],tip:'Knäna ska peka åt samma håll som tårna.'},
{id:'knastrack',name:'Sittande knästräckning',area:'Knä & höft',unit:'rep',pose:'kneeExt',tags:'knä lår quadriceps framsida sträck stol sitta',steps:['Sitt långt bak på en stol med båda fötterna i golvet.','Sträck ut ena benet tills det är rakt. Håll i 2 sekunder.','Sänk foten långsamt. Byt ben när du gjort alla repetitioner.'],tip:'Spänn framsidan av låret när benet är rakt.'},
{id:'balans',name:'Balans på ett ben',area:'Knä & höft',unit:'sek',pose:'balance',tags:'balans stabilitet fot fotled knä stå ett ben fall fallprevention',steps:['Stå nära en vägg eller ett bord som du kan ta stöd mot.','Lyft ena foten från golvet och stå stilla på det andra benet.','Håll positionen så länge som angivet. Byt sedan ben.'],tip:'Titta på en fast punkt framför dig, det gör det lättare.'},
{id:'tahavning',name:'Tåhävning',area:'Fot & fotled',unit:'rep',pose:'calf',tags:'vad fot fotled hälsena achilles tå tår',steps:['Stå med fötterna höftbrett isär. Håll lätt i en stolsrygg.','Res dig upp på tå så högt du kan.','Sänk hälarna långsamt ner mot golvet.'],tip:'Gör nedåtrörelsen lugnt, räkna till tre.'},
{id:'bro',name:'Bäckenlyft (bryggan)',area:'Rygg & bål',unit:'rep',pose:'bridge',tags:'rygg ländrygg säte bål höft bro brygga lyft rumpa',steps:['Ligg på rygg med böjda knän och fötterna i golvet.','Spänn magen och lyft bäckenet tills kroppen är rak från knä till axel.','Håll en sekund och sänk långsamt.'],tip:'Pressa genom hälarna, inte tårna.'},
{id:'planka',name:'Planka på knä',area:'Rygg & bål',unit:'sek',pose:'plank',tags:'bål mage core rygg stabilitet planka',steps:['Ligg på mage med armbågarna under axlarna.','Lyft bäckenet så att kroppen blir rak från knä till huvud.','Andas lugnt och håll positionen.'],tip:'Svanka inte. Dra naveln lätt inåt.'},
{id:'benlyft',name:'Sidoliggande benlyft',area:'Knä & höft',unit:'rep',pose:'sideLeg',tags:'höft säte gluteus utsida ben ligga sida',steps:['Ligg på sidan med det undre benet lätt böjt.','Lyft det övre benet rakt upp, med tån pekande framåt.','Sänk långsamt utan att vila benet helt.'],tip:'Rulla inte bakåt med höften.'},
{id:'armlyft',name:'Armlyft framåt',area:'Axel & nacke',unit:'rep',pose:'armRaise',tags:'axel arm skuldra lyft rörlighet flexion',steps:['Stå rak med armarna längs sidan.','Lyft armarna framåt till axelhöjd med tummarna uppåt.','Sänk långsamt tillbaka.'],tip:'Håll axlarna nere, långt från öronen.'},
{id:'vaggarm',name:'Armhävning mot vägg',area:'Axel & nacke',unit:'rep',pose:'wallPush',tags:'axel bröst arm skuldra armhävning vägg tryck',steps:['Stå en armlängd från en vägg med händerna mot väggen i axelhöjd.','Böj armarna och för bröstet mot väggen.','Tryck dig tillbaka tills armarna är raka.'],tip:'Håll kroppen rak som en planka.'},
{id:'nacke',name:'Haka in (nackretraktion)',area:'Axel & nacke',unit:'rep',pose:'chin',tags:'nacke hållning huvud haka dubbelhaka',steps:['Sitt eller stå rak och titta rakt fram.','Dra hakan rakt bakåt, som en dubbelhaka. Huvudet ska inte tippa.','Håll 3 sekunder och slappna av.'],tip:'Rörelsen är liten. Det ska kännas i nacken, inte göra ont.'},
{id:'utfall',name:'Utfallssteg',area:'Knä & höft',unit:'rep',pose:'lunge',tags:'utfall lunge ben lår säte knä steg',steps:['Stå rak med fötterna ihop. Håll gärna i en stolsrygg.','Ta ett långt steg framåt och böj båda knäna.','Tryck ifrån med främre foten och gå tillbaka. Byt ben.'],tip:'Främre knät ska vara ovanför foten, inte framför tårna.'},
{id:'trappsteg',name:'Uppkliv på trappsteg',area:'Knä & höft',unit:'rep',pose:'stepUp',tags:'trappa steg uppkliv knä lår vardag gå',steps:['Stå framför ett trappsteg och håll i ledstången.','Sätt ena foten på steget och kliv upp tills benet är rakt.','Gå ner lugnt med samma ben först. Byt ben efter alla repetitioner.'],tip:'Låt inte knät falla inåt när du kliver upp.'}
];
const TPL=[{name:'Knäartros',perWeek:3,items:[['knaboj',3,10],['knastrack',3,12],['trappsteg',3,10],['balans',3,30]]},{name:'Ländrygg',perWeek:3,items:[['bro',3,12],['planka',3,20],['benlyft',2,12]]},{name:'Axel',perWeek:3,items:[['armlyft',3,10],['vaggarm',2,12],['nacke',2,10]]},{name:'Balans och fallprevention',perWeek:4,items:[['balans',3,20],['tahavning',3,12],['knaboj',2,10],['utfall',2,8]]}];
const EXM=Object.fromEntries(EX.map(e=>[e.id,e]));
const AREAS=['Alla','Knä & höft','Rygg & bål','Axel & nacke','Fot & fotled'];

/* ---------- figures ---------- */
const ST={H:[100,22],S:[100,42],E:[101,64],W:[102,86],P:[100,84],K:[101,110],A:[100,136],T:[113,136]};
const L2={K2:[99,110],A2:[99,136],T2:[112,136]};
const up=(o,dy,keep)=>Object.fromEntries(Object.entries(o).map(([k,v])=>[k,keep.includes(k)?v:[v[0],v[1]+dy]]));
const POSES={
squat:{prop:'chair',a:{...ST,...L2},b:{H:[90,52],S:[94,68],E:[116,70],W:[138,68],P:[76,100],K:[108,108],A:[100,136],T:[113,136],K2:[107,108],A2:[99,136],T2:[112,136]}},
kneeExt:{prop:'chair2',a:{H:[86,38],S:[86,56],E:[90,78],W:[100,96],P:[88,98],K:[120,99],A:[120,136],T:[132,136],K2:[119,100],A2:[119,136],T2:[131,136]},b:{A:[156,97],T:[160,86]}},

calf:{prop:'',a:{...ST,...L2},b:Object.assign(up({...ST,...L2},-9,['T','T2']),{A:[101,128],A2:[100,128]})},
bridge:{prop:'mat',a:{H:[34,124],S:[50,128],E:[70,131],W:[90,132],P:[96,128],K:[124,104],A:[142,134],T:[154,134]},b:{P:[98,104],K:[127,97]}},
plank:{prop:'mat',a:{H:[154,108],S:[140,116],E:[140,134],W:[162,134],P:[96,128],K:[66,134],A:[38,124],T:[32,134]},b:{H:[156,98],S:[140,108],P:[98,114]}},
sideLeg:{prop:'mat',a:{H:[30,116],S:[48,122],E:[34,108],W:[28,116],P:[100,126],K:[130,127],A:[160,128],T:[166,122],K2:[128,132],A2:[158,133],T2:[165,128]},b:{K:[128,113],A:[154,100],T:[160,94]}},

wallPush:{prop:'wall',a:{H:[146,40],S:[136,54],E:[151,56],W:[164,58],P:[112,92],K:[102,114],A:[92,136],T:[104,136]},b:{H:[154,46],S:[146,60],E:[150,77],P:[118,94],K:[105,115]}},

stepUp:{prop:'step',a:{H:[90,22],S:[90,42],E:[91,64],W:[92,86],P:[90,84],K:[112,96],A:[118,112],T:[130,112],K2:[90,110],A2:[90,136],T2:[103,136]},b:{H:[114,8],S:[114,28],E:[115,50],W:[116,72],P:[115,68],K:[117,90],A:[118,112],T:[130,112],K2:[102,92],A2:[98,114],T2:[108,118]}}
};
for(const p of Object.values(POSES))p.b={...p.a,...p.b};
const PROPS={chair:'<path class="prop" d="M46 103h32M48 103V64M50 103v35M76 103v35"/>',chair2:'<path class="prop" d="M68 103h36M70 103V58M72 103v35M102 103v35"/>',mat:'<path class="prop" d="M14 138h172"/>',wall:'<path class="prop" d="M168 8v130"/>',step:'<path class="prop" d="M106 112h58v26M106 112v26"/>','':''};
const seg=(j,a,b)=>j[a]&&j[b]?`<line x1="${j[a][0].toFixed(1)}" y1="${j[a][1].toFixed(1)}" x2="${j[b][0].toFixed(1)}" y2="${j[b][1].toFixed(1)}"/>`:'';
const limbs=j=>seg(j,'P','K2')+seg(j,'K2','A2')+seg(j,'A2','T2')+seg(j,'S','P')+seg(j,'S','H')+seg(j,'P','K')+seg(j,'K','A')+seg(j,'A','T')+seg(j,'S','E')+seg(j,'E','W')+`<circle cx="${j.H[0].toFixed(1)}" cy="${j.H[1].toFixed(1)}" r="11"/>`;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const fig=(exId,anim)=>{const e=EXM[exId];if(e&&e.img)return `<img class="exphoto" src="${e.img}" alt="">`;const p=POSES[(e&&POSES[e.pose])?e.pose:'armRaise'];const floor=p.prop==='mat'?'':'<path class="prop" d="M14 138h172"/>';return `<svg class="exfig${anim?' anim':''}" data-pose="${EXM[exId].pose}" viewBox="0 -4 200 150" aria-hidden="true">${floor}${PROPS[p.prop]}<g class="ghost">${limbs(p.a)}</g><g class="live">${limbs(anim&&!RM?p.a:p.b)}</g></svg>`};
const figPose=(pose,anim)=>fig.call(null,'__p_'+pose,anim);
const lerp=(p,t)=>{const o={};for(const k in p.a){const a=p.a[k],b=p.b[k];o[k]=[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]}return o};
const ease=t=>.5-.5*Math.cos(Math.PI*t);
const tick=ms=>{if(!RM){const ph=(ms%3600)/3600;const t=ph<.4?ease(ph/.4):ph<.5?1:ph<.9?1-ease((ph-.5)/.4):0;
  for(const s of document.querySelectorAll('svg.exfig.anim')){const g=s.querySelector('.live');if(g)g.innerHTML=limbs(lerp(POSES[s.dataset.pose],t))}}
  requestAnimationFrame(tick)};
requestAnimationFrame(tick);

/* ----- pain description: anatomical figure, VAS, symbols ----- */
const PAINT=[
['Molande','Dov, ihållande värk','<circle cx="20" cy="20" r="5" fill="currentColor" stroke="none"/><circle cx="20" cy="20" r="11"/><circle cx="20" cy="20" r="17" opacity=".45"/>'],
['Huggande','Plötslig och skarp','<path d="M24 2L10 22h9l-4 16 15-22h-9z" fill="currentColor" stroke="none"/>'],
['Brännande','Het eller svidande','<path d="M20 3c2 8 11 11 11 21a11 11 0 0 1-22 0c0-6 3-8 5-12 1 4 3 5 4 6 1-6-1-10 2-15z" fill="currentColor" stroke="none"/>'],
['Stickande','Som nålar','<path d="M7 7l8 8M20 3v11M33 7l-8 8M7 33l8-8M20 37V26M33 33l-8-8"/>'],
['Pirrande','Myrkrypningar eller domning','<g fill="currentColor" stroke="none"><circle cx="9" cy="10" r="2.6"/><circle cx="21" cy="7" r="2.6"/><circle cx="32" cy="12" r="2.6"/><circle cx="14" cy="21" r="2.6"/><circle cx="27" cy="22" r="2.6"/><circle cx="8" cy="31" r="2.6"/><circle cx="20" cy="33" r="2.6"/><circle cx="32" cy="31" r="2.6"/></g>'],
['Strålande','Sprider sig ut','<circle cx="10" cy="20" r="5" fill="currentColor" stroke="none"/><path d="M18 20h17M30 15l5 5-5 5M17 13l13-7M17 27l13 7"/>'],
['Stelt','Svårt att röra sig','<rect x="7" y="16" width="26" height="8" rx="2" fill="currentColor" stroke="none"/><path d="M7 8v24M33 8v24"/>'],
['Krampande','Drar ihop sig','<path d="M20 20m-3 0a3 3 0 1 1 6 0a7 7 0 1 1-14 0a11 11 0 1 1 22 0a15 15 0 1 1-30 0"/>']];
const PTM=Object.fromEntries(PAINT.map(x=>[x[0],x]));

function vFysio(){const P=S.order.map(pat);const unread=P.reduce((s,p)=>s+p.unread,0);
  const nav=[['oversikt','Översikt',IC.home,0],['patienter','Patienter',IC.users,0],['meddelanden','Meddelanden',IC.chat,unread]].map(([v,l,i,n])=>`<button data-act="fpage" data-v="${v}" aria-current="${ui.fpage===v&&!ui.fpid||(v==='patienter'&&!!ui.fpid)}">${i}${l}${n?`<span class="n">${n}</span>`:''}</button>`).join('');

  return `<div class="fshell"><nav class="side" aria-label="Fysioterapeutmeny">${nav}<div class="who"><strong>Erik Lund</strong><br>Leg. fysioterapeut<br><span class="mut">Vårdcentralen Exempel</span></div></nav><section class="fmain">${main}</section></div>`}
function attention(){const out=[];for(const p of S.order.map(pat)){const pi=painInfo(p);
  if(p.unread)out.push(['co',IC.chat,`Nytt meddelande från ${p.first}`,(p.msgs[p.msgs.length-1].pain?'Med smärtbeskrivning. ':'')+esc(p.msgs[p.msgs.length-1].text.slice(0,70)),'Svara',p.id,'msg']);
  if(pi&&pi.last.pain>p.painLimit)out.push(['co',IC.alert,`${p.first} är över smärtgränsen`,`Senast ${pi.last.pain}/10, gräns ${p.painLimit}/10`,'Justera',p.id,'prog']);
  const f=flags(p,7).filter(x=>x.flag);if(f.length)out.push(['am',IC.flag,`${p.first} har flaggat ${f.length===1?'en övning':f.length+' övningar'}`,[...new Set(f.map(x=>EXM[x.ex].name+': '+x.flag))].slice(0,2).join(', '),'Visa',p.id,'uppf']);
  if(!prog(p).length)out.push(['in',IC.edit,`Skapa program åt ${p.first}`,esc(p.dx),'Skapa',p.id,'prog']);
  const a=adherence(p);if(a.pct!=null&&a.pct<60)out.push(['am',IC.pulse,`${p.first} har gjort ${a.done} av ${a.plan} pass`,'Senaste 14 dagarna','Skriv',p.id,'msg'])}
  return out}
function attHtml(list){return list.map(([c,i,t,s,b,id,tab])=>`<div class="att"><span class="ai" style="background:var(--${c}s);color:var(--${c==='am'?'ami':c})">${i}</span><div><strong>${esc(t)}</strong><br><span class="small mut">${s}</span></div><button class="btn sm" data-act="fsel" data-id="${id}" data-tab="${tab}">${b}</button></div>`).join('')}
function fOverview(){const P=S.order.map(pat);const A=attention();const act=P.filter(p=>prog(p).length);const avg=act.length?Math.round(act.reduce((s,p)=>s+(adherence(p).pct||0),0)/act.length):0;
  const up=P.map(p=>[p,new Date(fromKey(p.nextVisit))]).concat(P.filter(p=>p.booking).map(p=>[p,null])).slice(0,6);

  <div class="kpis"><div class="kpi"><span class="ki">${IC.users}</span><strong>${P.length}</strong><span class="small mut">Aktiva patienter</span></div><div class="kpi"><span class="ki">${IC.pulse}</span><strong>${avg} %</strong><span class="small mut">Snittföljsamhet, 14 dagar</span></div><div class="kpi"><span class="ki" style="background:var(--ams);color:var(--ami)">${IC.alert}</span><strong>${A.length}</strong><span class="small mut">Kräver uppmärksamhet</span></div><div class="kpi"><span class="ki">${IC.chat}</span><strong>${P.reduce((s,p)=>s+p.unread,0)}</strong><span class="small mut">Olästa meddelanden</span></div></div>
  <div class="g2"><div class="card" style="display:grid;gap:10px"><div><h3>Kräver uppmärksamhet</h3><p class="small mut">Sorterat efter vad som brådskar mest</p></div>${attHtml(A)||'<p class="mut">Inget just nu.</p>'}</div>
  <div class="card" style="display:grid;gap:8px;align-content:start"><h3>Kommande</h3>${P.filter(p=>p.booking).map(p=>`<div class="att" style="grid-template-columns:auto 1fr auto"><span class="tag co plain">Telefon</span><div><strong>${esc(p.name)}</strong><br><span class="small mut">${esc(p.booking)}</span></div><span></span></div>`).join('')}${[...P].sort((a,b)=>a.nextVisit<b.nextVisit?-1:1).map(p=>`<div class="att" style="grid-template-columns:auto 1fr auto"><span class="tag plain" style="min-width:4.5em;justify-content:center">${fmt(fromKey(p.nextVisit))}</span><div><strong>${esc(p.name)}</strong><br><span class="small mut">Återbesök</span></div><span class="tag in plain">På plats</span></div>`).join('')}</div></div>
  ${fTable()}`}
function fTable(){return `<div class="card" style="padding:0;overflow:hidden"><div class="between" style="padding:16px 18px"><h3>Mina patienter</h3><span class="small mut">Klicka på en patient för att öppna</span></div><div style="overflow-x:auto"><table class="pt stack"><thead><tr><th>Patient</th><th>Program</th><th>Pass, 14 dagar</th><th>Smärta</th><th>Senaste pass</th><th>Status</th></tr></thead><tbody>${S.order.map(id=>{const p=pat(id),a=adherence(p),pi=painInfo(p),st=status(p);
  return `<tr class="rowlink" data-act="fsel" data-id="${id}" tabindex="0" role="button"><td data-l="Patient"><span class="row" style="gap:10px;flex-wrap:nowrap"><span class="av">${esc(p.first[0]+p.name.split(' ')[1][0])}</span><span><strong>${esc(p.name)}</strong><br><span class="small mut">${esc(p.dx)}</span></span></span></td><td data-l="Program">${prog(p).length?`Vecka ${progWeek(p)} av ${p.weeks}<br><span class="small mut">${perWk(p.program.perWeek)}</span>`:'<span class="mut">–</span>'}</td>
  <td data-l="Pass, 14 dagar">${a.pct==null?'<span class="mut">–</span>':`<div class="row" style="gap:8px;flex-wrap:nowrap"><div class="meter" style="width:90px"><i class="${a.pct<60?'bad':a.pct<85?'low':''}" style="width:${a.pct}%"></i></div><span class="num small">${a.done}/${a.plan}</span></div>`}</td>

function fPatients(){return `<h1>Patienter</h1>${fTable()}`}
function fInbox(){const P=S.order.map(pat);const sel=pat(ui.fmsg)||P[0];
  const list=P.map(p=>{const m=p.msgs[p.msgs.length-1];return `<button data-act="fmsg" data-id="${p.id}" aria-current="${p.id===sel.id}"><span class="av">${esc(p.first[0])}</span><span><strong>${esc(p.name)}</strong><br><span class="small mut">${m?esc(m.text.slice(0,42)):'Inga meddelanden'}</span></span>${p.unread?`<span class="tag co plain">${p.unread}</span>`:''}</button>`}).join('');

function fThread(p){if(p.unread){p.unread=0;save()}const a=adherence(p),pi=painInfo(p);

  ${prog(p).length?`<div class="note tl small">Senaste 14 dagarna: <strong>${a.done} av ${a.plan} pass</strong>${pi?`, smärta senast <strong>${pi.last.pain}/10</strong> (gräns ${p.painLimit})`:''}.${p.booking?' Telefonmöte bokat: '+esc(p.booking)+'.':''}</div>`:''}
  <div class="thread">${p.msgs.map(m=>msgHtml(m,p.first,m.from==='f')).join('')||'<p class="mut">Inga meddelanden ännu.</p>'}</div>
  <div class="quick"><button class="chip" data-act="fquick" data-v="Bra jobbat! Fortsätt som vanligt.">Bra jobbat</button><button class="chip" data-act="fquick" data-v="Minska antalet repetitioner tills det inte gör ont, och hör av dig om det inte blir bättre.">Minska belastningen</button><button class="chip" data-act="fquick" data-v="Jag ringer upp dig så pratar vi om det.">Jag ringer dig</button></div>
  <label class="sr" for="ftext">Svara ${esc(p.first)}</label><textarea id="ftext" placeholder="Skriv ett svar till ${esc(p.first)}"></textarea><div class="row"><button class="btn pri" data-act="fsend" data-id="${p.id}">Skicka svar</button><button class="btn" data-act="fgive" data-id="${p.id}">Ge ett extra meddelande</button></div>`}
function fProfile(p){const st=status(p);
  const tabs=[['uppf','Översikt'],['prog','Träningsprogram'],['msg','Meddelanden'+(p.unread?' ('+p.unread+')':'')]].map(([v,l])=>`<button data-act="ftab" data-v="${v}" aria-current="${ui.ftab===v}">${l}</button>`).join('');
  return `<button class="link" data-act="fback" style="justify-self:start;padding-left:0">← Patienter</button>

  <div class="row" style="gap:8px"><button class="btn sm" data-act="ftab" data-v="msg">${IC.chat.replace('<svg','<svg width="18" height="18"')}Meddelande</button><button class="btn sm" data-act="journal">${IC.doc.replace('<svg','<svg width="18" height="18"')}Till journal</button><button class="btn sm pri" data-act="ftab" data-v="prog">${IC.edit.replace('<svg','<svg width="18" height="18"')}Justera program</button></div></div>
  <nav class="tabs">${tabs}</nav>${ui.ftab==='uppf'?fFollow(p):ui.ftab==='prog'?fProg(p):`<div style="max-width:760px;display:grid;gap:14px">${fThread(p)}</div>`}`}
function weekBars(p){if(!p.since)return '';const s=wkStart(fromKey(p.since)),cur=progWeek(p),per=p.program.perWeek;const n=Math.min(p.weeks,8);let h='';
  for(let w=1;w<=n;w++){const a=addD(s,(w-1)*7);const c=inRange(p,a,addD(a,6)).length;const pl=wkPlan(p,w);const pct=Math.min(100,c/pl*100);h+=`<div><span>${w<=cur?c+'/'+pl:''}</span><div class="col">${w<=cur?`<i class="${c<pl&&w<cur?'low':''}" style="height:${pct}%"></i>`:''}</div><span>v${w}</span></div>`}
  return `<div class="wbars" style="--n:${n}">${h}</div><div class="legend" style="margin-top:8px"><span><i style="background:var(--t)"></i>Mål nått / pågår</span><span><i style="background:var(--am)"></i>Färre pass än planerat</span></div>`}
function fFollow(p){if(!prog(p).length)return `<div class="empty"><h3>${esc(p.first)} har inget program ännu</h3><p>Skapa ett program så kan du följa träning och smärta här.</p><button class="btn pri" data-act="ftab" data-v="prog" style="margin-top:10px">Skapa program</button></div>`;
  const a=adherence(p),pi=painInfo(p);const F=flags(p);

  const over=pi&&pi.last.pain>p.painLimit;

  return `${over?`<div class="note co between"><span><strong>Smärtan ligger över gränsen ${p.painLimit}/10</strong> (senast ${pi.last.pain}/10). Överväg att sänka belastningen eller byta övning.</span><button class="btn sm pri" data-act="ftab" data-v="prog">Justera program</button></div>`:''}
  <div class="g3"><div class="card"><div class="between"><h3>Följsamhet</h3><span class="tag ${a.pct<60?'co':a.pct<85?'am':'ok'}">${a.pct<60?'Låg':a.pct<85?'Sjunkande':'Bra'}</span></div><p class="small mut">Pass per vecka mot målet ${p.program.perWeek}</p><div class="row" style="gap:8px;margin-top:6px"><strong style="font-size:2rem">${a.pct} %</strong><span class="small mut">${a.done} av ${a.plan} pass, 14 dagar<br>Snitt ${a.vol??'–'} % av ordinerad mängd</span></div>${weekBars(p)}</div>

  <div class="card"><h3>Per övning</h3><p class="small mut">Andel av ordinerad mängd, 14 dagar</p>${perExList(p)}</div></div>

function fProg(p){if(!ui.draft){ui.draft=clone(p.program);ui.draft.weeks=p.weeks;ui.draft.painLimit=p.painLimit;ui.dirty=false}const D=ui.draft;

  <div><label class="small mut" for="dn${i}">Egen instruktion till ${esc(p.first)} (valfritt)</label><input type="text" id="dn${i}" data-in="dnote" data-i="${i}" value="${esc(it.note)}" placeholder="T.ex. Använd en stol med armstöd"></div>
  ${ui.editI===i?`<div class="note tl" style="display:grid;gap:8px"><label class="small" for="ds${i}"><strong>Instruktionssteg</strong>, ett steg per rad</label><textarea id="ds${i}" data-in="dsteps" data-i="${i}">${esc((it.steps||e.steps).join('\n'))}</textarea><label class="small" for="dt${i}"><strong>Tänk på</strong></label><input type="text" id="dt${i}" data-in="dtip" data-i="${i}" value="${esc(it.tip||e.tip)}"><div class="row"><button class="btn sm pri" data-act="dedit" data-i="${i}">Klar</button>${it.steps||it.tip?`<button class="link small" data-act="dorig" data-i="${i}">Återställ bibliotekets text</button>`:''}</div></div>`:`<button class="link small" data-act="dedit" data-i="${i}" style="justify-self:start;padding-left:0">Ändra instruktionstext${it.steps||it.tip?' (ändrad för '+esc(p.first)+')':''}</button>`}</div></div>`}).join('');
  return `<div class="g2" style="grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)"><div class="card" style="align-self:start;display:grid;gap:10px"><div class="between"><h3>Övningsbibliotek</h3><span class="small mut">${EX.length} övningar</span></div><label class="sr" for="q">Sök övning</label><input type="search" id="q" data-in="q" value="${esc(ui.q)}" placeholder="Sök: knä, rygg, balans, axel…"><div class="row" style="gap:6px">${AREAS.map(a=>`<button class="chip" style="padding:6px 12px;min-height:40px" data-act="farea" data-v="${a}" aria-pressed="${ui.area===a}">${a}</button>`).join('')}</div>
  <div><span class="small mut">Snabbstart med en mall</span><div class="row" style="gap:6px;margin-top:4px">${TPL.map((t,i)=>`<button class="chip" style="min-height:40px;padding:6px 12px" data-act="tpl" data-i="${i}">+ ${t.name}</button>`).join('')}</div></div><div class="libgrid" id="lib">${libList()}</div></div>
  <div style="display:grid;gap:12px;align-content:start"><div class="between"><h2>Program för ${esc(p.first)}</h2>${ui.dirty?'<span class="tag am">Osparade ändringar</span>':'<span class="tag ok">Sparat</span>'}</div>
  <div class="setgrid">${st('dper',D.perWeek,'Pass per vecka',D.perWeek===1?'Patienten väljer dag':'Patienten väljer dagar')}${st('dweeks',D.weeks,'Programlängd','veckor')}${st('dlimit',D.painLimit,'Smärtgräns','av 10 på VAS')}</div>
  <p class="small mut">Ett pass = alla övningar nedan · ${D.items.length} övningar</p>${items||'<div class="empty">Passet är tomt. Välj övningar i biblioteket eller börja från en mall.</div>'}

  if(pts.length){g+=pts.map(l=>`<circle cx="${x(l.date).toFixed(1)}" cy="${y(l.pain).toFixed(1)}" r="${l.pain>p.painLimit?5:3.5}" fill="${l.pain>p.painLimit?'var(--co)':'var(--card)'}" stroke="${l.pain>p.painLimit?'var(--co)':'var(--t)'}" stroke-width="2"><title>${fmt(fromKey(l.date))}: ${l.pain}/10</title></circle>`).join('');

  case 'fdate':mod(()=>{ui.form=formFor(p,d.v)});break;
  case 'fother':mod(()=>{const k=ui.form.date===TK?key(addD(TODAY,-1)):ui.form.date;ui.form=formFor(p,k);ui.form.other=true});break;
  case 'fstep':mod(()=>{const x=ui.form.items[d.ex];const sek=d.f==='reps'&&EXM[d.ex].unit==='sek';x[d.f]=Math.max(d.f==='sets'?0:1,Math.min(d.f==='sets'?10:300,x[d.f]+(+d.d)*(sek?5:1)))});break;
  case 'fopen':mod(()=>{const x=ui.form.items[d.ex];x.open=!x.open;if(!x.open){x.flag=null;x.comment=''}});break;
  case 'fflag':mod(()=>{const x=ui.form.items[d.ex];x.flag=x.flag===d.v?null:d.v});break;
  case 'feff':mod(()=>{ui.form.effort=ui.form.effort===d.v?null:d.v});break;
  case 'fnote':mod(()=>{ui.form.noteOpen=true});setTimeout(()=>{const t=document.getElementById('lognote');t&&t.focus()},20);break;
  case 'vas':mod(()=>{const f=PF();f.pain=+d.v;if(!f.pain){f.area=[];f.type=[]}});break;
  case 'bview':mod(()=>{PF().view=d.v});break;
  case 'zoomin':mod(()=>{const f=PF();const g=groupOf(d.v);const v=f.view||'fram';f.zoom={g,side:sideOf(d.v),view:ZG[g][v]?v:(ZG[g].fram?'fram':'bak')}});break;
  case 'zoomout':mod(()=>{PF().zoom=null});break;
  case 'zview':mod(()=>{const f=PF();f.zoom.view=d.v;f.view=d.v});break;
  case 'area':mod(()=>{const f=PF();f.area=f.area.includes(d.v)?f.area.filter(x=>x!==d.v):[...f.area,d.v]});break;
  case 'ptype':mod(()=>{const f=PF();f.type=f.type.includes(d.v)?f.type.filter(x=>x!==d.v):[...f.type,d.v]});break;
  case 'savelog':{const f=ui.form;const items={};for(const ex in f.items){const x=f.items[ex];items[ex]={sets:x.sets,reps:x.reps,flag:x.flag||null,comment:(x.comment||'').trim()}}
    let l=logOf(p,f.date);if(!l){l={date:f.date};p.logs.push(l);p.logs.sort((a,b)=>a.date<b.date?-1:1)}
    Object.assign(l,{items,pain:f.pain,area:f.area,type:f.type,note:(f.note||'').trim(),effort:f.effort||null});save();ui.modal=null;render();
    const n=weekDone(p),per=p.program.perWeek;toast(n>=per?`Pass sparat! Veckans mål på ${per} pass är nått.`:`Pass sparat! ${n} av ${per} pass den här veckan.`);break}
  case 'close':ui.modal=null;renderModal();break;
  case 'compose':openCompose(p,'');break;
  case 'quick':if(d.v==='ont')openCompose(p,'',true);else openCompose(p,'Jag är osäker på hur jag ska göra ');break;
  case 'ack':ui.modal=null;ui.composer=true;render();if(ui.pendingPain){ui.pendingPain=false;ui.pform={pain:null,area:[],type:[],view:'fram'};ui.modal={type:'painpick'};renderModal()}else setTimeout(()=>{const t=document.getElementById('ptext');if(t){t.focus();t.setSelectionRange(t.value.length,t.value.length)}},30);break;
  case 'pcancel':ui.composer=false;ui.att=null;ui.patt=null;ui.prefill='';render();break;
  case 'psend':{const t=document.getElementById('ptext').value.trim();if(!t&&!ui.att&&!ui.patt){toast('Skriv något först.');return}p.msgs.push({from:'p',text:t,t:Date.now(),att:ui.att,pain:ui.patt});ui.patt=null;p.msgLeft--;p.unread++;ui.composer=false;ui.att=null;ui.prefill='';save();render();toast('Skickat till Erik.');break}
  case 'painpick':ui.pform={pain:null,area:[],type:[],view:'fram'};ui.modal={type:'painpick'};renderModal();break;
  case 'painok':ui.patt=clone(ui.pform);delete ui.patt.view;ui.modal=null;keepText(render);break;
  case 'painrm':ui.patt=null;keepText(render);break;
  case 'book':ui.modal={type:'book'};renderModal();break;
  case 'slot':mod(()=>{ui.modal.slot=d.v});break;
  case 'dobook':p.booking=ui.modal.slot;ui.modal=null;save();render();toast('Telefonmötet är bokat.');break;
  case 'fpage':ui.fpage=d.v;ui.fpid=null;ui.draft=null;ui.dirty=false;render();window.scrollTo(0,0);break;
  case 'fsel':ui.editI=null;ui.fpid=d.id;ui.ftab=d.tab||'uppf';ui.draft=null;ui.dirty=false;ui.q='';ui.area='Alla';render();window.scrollTo(0,0);break;
  case 'fback':ui.fpid=null;ui.draft=null;ui.dirty=false;if(ui.fpage==='oversikt')ui.fpage='patienter';render();break;
  case 'ftab':ui.editI=null;ui.ftab=d.v;if(d.v!=='prog'){ui.draft=null;ui.dirty=false}render();break;
  case 'fmsg':ui.fmsg=d.id;render();break;
  case 'fquick':{const t=document.getElementById('ftext');t.value=d.v;t.focus();break}
  case 'dper':ui.draft.perWeek=Math.max(1,Math.min(7,ui.draft.perWeek+(+d.d)));dr();break;
  case 'dweeks':ui.draft.weeks=Math.max(1,Math.min(26,ui.draft.weeks+(+d.d)));dr();break;
  case 'dlimit':ui.draft.painLimit=Math.max(1,Math.min(10,ui.draft.painLimit+(+d.d)));dr();break;
  case 'dadd':{const e=EXM[d.ex];ui.draft.items.push({ex:d.ex,sets:3,reps:e.unit==='sek'?30:10,note:''});dr();toast(e.name+' tillagd');break}
  case 'newex':ui.nx={name:d.v||'',area:ui.area!=='Alla'?ui.area:'Knä & höft',unit:'rep',pose:'squat',img:null,steps:'',tip:'',dont:'',why:''};ui.modal={type:'newex'};renderModal();setTimeout(()=>{const t=document.getElementById(d.v?'nx-steps':'nx-name');t&&t.focus()},40);break;
  case 'nxset':mod(()=>{ui.nx[d.k]=d.k==='img'?null:d.v});break;
  case 'nxsave':{const n=ui.nx;const steps=n.steps.split('\n').map(x=>x.trim()).filter(Boolean);
    if(!n.name.trim()){toast('Skriv ett namn på övningen.');document.getElementById('nx-name').focus();return}
    if(!steps.length){toast('Skriv minst ett steg under Så gör du.');document.getElementById('nx-steps').focus();return}
    const id='c'+Date.now().toString(36);const e={id,name:cap(n.name.trim()),area:n.area,unit:n.unit,pose:n.pose,img:n.img||null,steps,tip:n.tip.trim()||'Rör dig lugnt och kontrollerat.',dont:n.dont.trim(),why:n.why.trim(),tags:(n.name+' '+n.area).toLowerCase(),custom:true};
    S.custom.push(e);EX.push(e);EXM[id]=e;save();ui.modal=null;
    if(ui.draft){ui.draft.items.push({ex:id,sets:3,reps:n.unit==='sek'?30:10,note:''});ui.dirty=true}
    ui.q='';render();toast(e.name+' är skapad och tillagd i programmet.');break}
  case 'dremove':ui.draft.items=ui.draft.items.filter(x=>x.ex!==d.ex);dr();break;
  case 'drm':ui.draft.items.splice(+d.i,1);ui.editI=null;dr();break;
  case 'dmove':{const I=ui.draft.items,i=+d.i,j=i+(+d.d);if(j<0||j>=I.length)return;[I[i],I[j]]=[I[j],I[i]];dr();break}
  case 'dstep':{const it=ui.draft.items[+d.i];const sek=EXM[it.ex].unit==='sek';it[d.f]=Math.max(1,Math.min(d.f==='sets'?10:300,it[d.f]+(+d.d)*(d.f==='reps'&&sek?5:1)));dr();break}
  case 'dedit':ui.editI=ui.editI===+d.i?null:+d.i;keepScroll(render);break;
  case 'dorig':{const it=ui.draft.items[+d.i];delete it.steps;delete it.tip;dr();break}
  case 'tpl':{const T=TPL[+d.i],D=ui.draft;if(!D.items.length)D.perWeek=T.perWeek;let n=0;for(const [ex,se,re] of T.items)if(!D.items.some(x=>x.ex===ex)){D.items.push({ex,sets:se,reps:re,note:''});n++}dr();toast(n?'Mallen '+T.name.toLowerCase()+' är tillagd. Justera vid behov.':'Övningarna finns redan i programmet.');break}
  case 'dundo':ui.draft=null;ui.editI=null;render();break;
  case 'dsave':{const D=ui.draft;p.program={perWeek:D.perWeek,items:D.items};p.weeks=D.weeks;p.painLimit=D.painLimit;if(!p.since)p.since=TK;p.msgs.push({from:'f',text:'Hej '+p.first+'! Jag har uppdaterat ditt träningsprogram: '+perWk(D.perWeek)+' i '+D.weeks+' veckor. Du hittar övningarna under Idag.',t:Date.now()});p.seenF=false;ui.draft=null;ui.dirty=false;ui.editI=null;save();render();toast('Programmet är skickat till '+p.first+'.');break}
  case 'farea':ui.area=d.v;document.querySelectorAll('[data-act=farea]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===ui.area));document.getElementById('lib').innerHTML=libList();break;
  case 'fsend':{const t=document.getElementById('ftext').value.trim();if(!t)return;p.msgs.push({from:'f',text:t,t:Date.now()});p.seenF=false;save();render();toast('Svar skickat.');break}
  case 'fgive':p.msgLeft=Math.min(p.msgMax,p.msgLeft+1);save();render();toast(p.first+' har fått ett extra meddelande.');break;
  case 'journal':ui.modal={type:'journal'};renderModal();break;
  case 'copy':{const t=document.getElementById(d.src);t.select();(navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>toast('Kopierat.')).catch(()=>{try{document.execCommand('copy');toast('Kopierat.')}catch(e){toast('Markera texten och kopiera manuellt.')}});break}
  case 'fbset':ui.fb[d.k]=ui.fb[d.k]===d.v?null:d.v;keepScroll(render);break;
  case 'fbt':{const t=ui.fb.tasks[d.id]=ui.fb.tasks[d.id]||{};t[d.k]=d.k==='ease'?+d.v:d.v;keepScroll(render);break}
  case 'fbsend':sendFb();break;
  case 'fbcopy':ui.modal={type:'copyfb'};renderModal();break;
  case 'resetask':ui.modal={type:'reset'};renderModal();break;
  case 'doreset':{const fb=S.fbLocal,cu=S.custom;S=seed();S.fbLocal=fb;S.custom=cu;save();ui.modal=null;ui.draft=null;ui.dirty=false;ui.composer=false;ui.fpid=null;render();toast('Demodatan är återställd.');break}
  }}
async function sendFb(){const f=ui.fb;const has=f.role||Object.keys(f.tasks).length||f.good||f.miss||f.hard;if(!has){toast('Fyll i något först.');return}
  const id='fb'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);const o={id,t:Date.now(),role:f.role||'',age:f.age||'',tasks:f.tasks,good:f.good||'',miss:f.miss||'',hard:f.hard||''};
  let shared=false;if(ui.db){try{await ui.db.collection('feedback').doc(id).set(o);shared=true}catch(e){}}
  if(!shared){S.fbLocal.push(o);save()}
  ui.fb={tasks:{}};render();window.scrollTo(0,0);toast(shared?'Tack! Din feedback är skickad.':'Tack! Feedbacken är sparad i den här webbläsaren.')}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;act(b.dataset.act,b.dataset,b)});
$modal.addEventListener('click',e=>{if(e.target.classList&&e.target.classList.contains('back')){ui.modal=null;renderModal()}},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){ui.modal=null;renderModal()}
  const r=e.target.closest&&e.target.closest('[role=button][data-act]');if(r&&(e.key==='Enter'||e.key===' ')){e.preventDefault();r.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
document.addEventListener('input',e=>{const t=e.target;const k=t.dataset&&t.dataset.in;if(!k)return;
  if(k==='q'){ui.q=t.value;document.getElementById('lib').innerHTML=libList()}
  if(k==='dnote'||k==='dsteps'||k==='dtip'){const it=ui.draft.items[+t.dataset.i];if(k==='dnote')it.note=t.value;else if(k==='dtip')it.tip=t.value;else it.steps=t.value.split('\n').map(x=>x.trim()).filter(Boolean);
    if(!ui.dirty){ui.dirty=true;const sb=document.querySelector('[data-act=dsave]');if(sb)sb.disabled=false}}
  if(k==='lognote')ui.form.note=t.value;
  if(k==='excom')ui.form.items[t.dataset.ex].comment=t.value;
  if(k==='fb')ui.fb[t.dataset.k]=t.value;
  if(k==='nx')ui.nx[t.dataset.k]=t.value});
document.addEventListener('toggle',e=>{const t=e.target;if(t.classList&&t.classList.contains('more')&&ui.form)ui.form.mapOpen=t.open},true);
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='logdate'&&t.value&&ui.form){const k=t.value>TK?TK:t.value;keepScroll(()=>{ui.form=formFor(pat(ui.pid),k);ui.form.other=true;renderModal()})}
  if(t.dataset&&t.dataset.in==='psel'){ui.pid=t.value;ui.composer=false;render()}
  if(t.id==='nximg'&&t.files&&t.files[0]){const f=t.files[0];if(f.size>1500000){toast('Bilden är för stor. Välj en bild under 1,5 MB.');return}const r=new FileReader();r.onload=()=>{ui.nx.img=r.result;keepScroll(renderModal)};r.readAsDataURL(f)}
  if(t.id==='patt'&&t.files&&t.files[0]){const f=t.files[0];ui.att={name:f.name};
    if(/^image\//.test(f.type)&&f.size<400000){const r=new FileReader();r.onload=()=>{ui.att.data=r.result;keepText(render)};r.readAsDataURL(f)}else keepText(render)}});
function route(){const h=location.hash.slice(1);ui.view=['patient','fysio','feedback'].includes(h)?h:'start';ui.modal=null;render();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);
route();
(async()=>{try{if(!window.claude||!window.claude.use)return;const db=await window.claude.use('db');if(!db)return;ui.db=db;
  db.collection('feedback').onSnapshot(snap=>{const docs=snap&&snap.docs?snap.docs:Array.isArray(snap)?snap:[];
    ui.fbList=docs.map(x=>typeof x.data==='function'?x.data():(x.data||x)).filter(x=>x&&typeof x==='object');if(ui.view==='feedback'&&!document.activeElement.matches('textarea'))keepScroll(render)},()=>{})}catch(e){}})();
}
</script>
</body>
