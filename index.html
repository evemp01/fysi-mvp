<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fysi MVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE calm clinical-warm, readable for 25 and 85 year olds alike
   IDEA the physio's home-exercise sheet made alive; one loop between clinic and kitchen floor
   PICTURE animated line figures per exercise; deep-teal week card; pain map front/back
   COLOUR Figma palette: warm paper ground, deep teal lead, amber for progress/limits, coral for pain, soft teal fields
   TYPE Plus Jakarta Sans 800 titles, 500 text; large base, A/A+/A++
   LAYOUT patient = phone column, bottom tabs; physio = sidebar + content, stacks under 900px */
:root{color-scheme:light dark;
--bg:light-dark(#f6f4ef,#0d1514);--card:light-dark(#ffffff,#15201f);--ink:light-dark(#1a2423,#e9efed);--mut:light-dark(#56625f,#a3b4b0);
--t:light-dark(#0f4c4a,#62c7b8);--hero:light-dark(#0f4c4a,#10403d);--btn:light-dark(#0f4c4a,#62c7b8);--onbtn:light-dark(#ffffff,#06201d);
--tl:light-dark(#eef7f5,#142b29);--tl2:light-dark(#d6ece8,#1d3b38);--line:light-dark(#e6e1d7,#263533);
--ok:light-dark(#2e7d4f,#62d193);--oks:light-dark(#e2f2e7,#14301f);
--am:light-dark(#e9a23b,#f0b354);--ami:light-dark(#8a5806,#f3c06a);--ams:light-dark(#fdf3e1,#33280f);
--co:light-dark(#c8483a,#ff8a78);--cos:light-dark(#f8e1de,#3a1d18);
--in:light-dark(#2f5597,#9fbaf0);--ins:light-dark(#e3ecf8,#1b2433)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{font-size:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 1.0625rem/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip}
h1,h2,h3,h4{line-height:1.15;letter-spacing:-.02em;margin:0;text-wrap:balance}
h1{font-size:clamp(1.9rem,4vw,2.5rem);font-weight:800}
h2{font-size:1.45rem;font-weight:800}
h3{font-size:1.15rem;font-weight:700}
h4{font-size:1.05rem;font-weight:700}
p{margin:.3em 0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--am);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:8px max(3vw,16px);border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.4rem;color:var(--t);text-decoration:none;letter-spacing:-.03em}
.logo{width:32px;height:32px;border-radius:9px;background:var(--hero);display:grid;place-items:center}
.roles{display:flex;flex-wrap:wrap;gap:4px;background:var(--bg);padding:4px;border-radius:14px}
.roles a{padding:8px 14px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:700;min-height:44px;display:flex;align-items:center}
.roles .smo{display:none}
.roles a[aria-current=page]{background:var(--btn);color:var(--onbtn)}
@media(max-width:560px){.fs>span{display:none}.top{gap:6px;flex-wrap:nowrap;padding:6px 10px}.brand{font-size:0;gap:0}.roles{flex-wrap:nowrap;padding:3px}.roles a{padding:6px 9px;min-height:40px;font-size:.92rem}.roles .lg{display:none}.roles .smo{display:inline}.fs button{min-width:36px;min-height:40px}.fs button:nth-child(3){display:none}}
.fs{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:.9rem;color:var(--mut)}
.fs button{border:1px solid var(--line);background:var(--card);border-radius:10px;min-width:44px;min-height:44px;font-weight:800}
.fs button[aria-pressed=true]{border-color:var(--t);background:var(--tl);color:var(--t)}
main{min-height:70vh}
.wrap{max-width:1280px;margin:0 auto;padding:24px max(3vw,16px) 40px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:700;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--btn);border-color:var(--btn);color:var(--onbtn)}
.btn.co{background:var(--co);border-color:var(--co);color:#fff}
.btn.sm{min-height:42px;padding:6px 12px;font-size:.93rem}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{flex:none;width:20px;height:20px}
.notice>svg{width:22px;height:22px;color:var(--mut)}
.link{background:none;border:0;color:var(--t);font-weight:700;text-decoration:underline;padding:8px 4px;min-height:44px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.mut{color:var(--mut)}
.small{font-size:.9rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;min-height:44px;font-weight:700}
.chip[aria-pressed=true]{background:var(--btn);border-color:var(--btn);color:var(--onbtn)}
.tag{display:inline-flex;align-items:center;gap:5px;background:var(--tl);color:var(--t);border-radius:999px;padding:3px 10px;font-size:.82rem;font-weight:700;white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.plain::before{display:none}
.tag.co{background:var(--cos);color:var(--co)}
.tag.am{background:var(--ams);color:var(--ami)}
.tag.ok{background:var(--oks);color:var(--ok)}
.tag.in{background:var(--ins);color:var(--in)}
.av{width:44px;height:44px;border-radius:50%;background:var(--tl2);color:var(--t);display:grid;place-items:center;font-weight:800;flex:none}
.note{border-radius:14px;padding:12px 14px;background:var(--ams)}
.note.in{background:var(--ins)}.note.tl{background:var(--tl)}.note.ok{background:var(--oks)}.note.co{background:var(--cos)}
/* start */
.start{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;margin-top:22px}
.start a{display:grid;gap:10px;padding:24px;border-radius:22px;text-decoration:none;color:var(--ink);border:1.5px solid var(--line);background:var(--card)}
.start a:hover{border-color:var(--t)}
.start a.hero{background:var(--hero);color:#fff;border-color:var(--hero)}
.start .art{height:150px;background:var(--tl);border-radius:14px;display:grid;place-items:center;color:var(--t)}
.start a.hero .art{background:rgba(255,255,255,.1)}
.start a.hero .exfig line,.start a.hero .exfig circle{stroke:#fff}.start a.hero .exfig circle{fill:var(--hero)}
/* figures */
.exfig{width:100%;height:100%;display:block}
.exfig .ghost{opacity:.2}
.exfig line{stroke:var(--t);stroke-width:7;stroke-linecap:round;fill:none}
.exfig circle{fill:var(--tl);stroke:var(--t);stroke-width:6}
.exfig .prop{stroke:var(--mut);stroke-width:3;opacity:.5;fill:none}
.pic{background:var(--tl);border-radius:12px;aspect-ratio:4/3}
/* patient phone */
.phone{max-width:480px;margin:18px auto 30px;border:1px solid var(--line);border-radius:30px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;min-height:min(840px,calc(100svh - 110px))}
@media(max-width:560px){.phone{margin:0;border:0;border-radius:0;min-height:calc(100svh - 64px)}}
.phead{padding:18px 18px 6px;display:grid;gap:4px}
.phead select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px;min-height:40px}
.pbody{flex:1;padding:12px 16px 18px;display:grid;gap:14px;align-content:start}
.pnav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--card)}
.pnav button{border:0;background:none;padding:8px 4px 12px;display:grid;justify-items:center;gap:2px;font-weight:700;font-size:.9rem;color:var(--mut);min-height:66px;position:relative}
.pnav button span.ic{display:grid;place-items:center;width:56px;height:32px;border-radius:999px}
.pnav button[aria-current=true]{color:var(--t)}
.pnav button[aria-current=true] span.ic{background:var(--tl2)}
.pnav svg{width:24px;height:24px}
.badge{position:absolute;top:4px;left:calc(50% + 12px);background:var(--co);color:#fff;border-radius:999px;font-size:.75rem;padding:0 6px;min-width:20px}
.herocard{background:var(--hero);color:#fff;border-radius:22px;padding:18px 18px 16px;display:grid;gap:10px}
.herocard .pill{background:var(--am);color:#2a1a00;border-radius:999px;padding:3px 10px;font-size:.82rem;font-weight:800;white-space:nowrap}
.big{font-size:2.4rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.prog{height:8px;border-radius:8px;background:rgba(255,255,255,.18);overflow:hidden}
.prog i{display:block;height:100%;background:var(--am);border-radius:8px}
.dots{display:flex;flex-wrap:wrap;gap:8px}
.dots i{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.45);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:.85rem}
.dots i.on{background:#fff;border-color:#fff;color:var(--hero)}
.dots svg{width:18px;height:18px}
.exrow{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;text-align:left;width:100%}
.exrow .go{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--mut)}
.exrow .go.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.exrow .go svg{width:18px;height:18px}
.dose{font-size:.95rem;color:var(--mut);font-weight:600}
.notice{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--ams);border:1px solid color-mix(in srgb,var(--am) 45%,transparent);border-radius:16px;padding:12px 14px;text-align:left;width:100%;color:var(--ink)}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:4px}
/* modal */
.back{position:fixed;inset:0;background:rgba(8,20,18,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.back{align-items:center;padding:20px}}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:94svh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px 22px;display:grid;gap:12px}
@media(min-width:700px){.sheet{border-radius:24px}}
.sheet>header{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:-18px;background:var(--bg);padding:6px 0;z-index:2}
.sheet .card{padding:16px}
.x{border:1px solid var(--line);background:var(--card);border-radius:999px;width:48px;height:48px;font-size:1.5rem;line-height:1;flex:none}
.bigfig{background:var(--tl);border-radius:18px;aspect-ratio:16/10}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:10px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start;font-size:1.08rem}
ol.steps li::before{content:counter(s);width:32px;height:32px;border-radius:50%;background:var(--tl2);color:var(--t);display:grid;place-items:center;font-weight:800}
.dodont{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;border-radius:12px;padding:10px 12px}
.dodont b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:.9rem}
.pnote{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start;background:var(--ams);border-radius:12px;padding:10px 12px}
.exnote{display:flex;gap:6px;align-items:flex-start;color:var(--ami);margin-top:4px;font-weight:600}
.exnote svg{flex:none;margin-top:3px}
.exnote span{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.vthumb{width:100%;height:100%;min-height:60px;display:grid;place-items:center;align-content:center;gap:4px;background:var(--hero);color:#fff;font-weight:700;font-size:.8rem}
.vthumb span{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center}
.gal{display:grid;gap:8px}
.galtrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:16px;scrollbar-width:none}
.gslide{flex:0 0 100%;min-width:0;scroll-snap-align:start;display:grid;align-content:center}
.gimg{width:100%;max-height:440px;object-fit:contain;background:var(--tl);border-radius:16px;display:block}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.mthumb{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--tl)}
.mthumb>img,.mthumb>video{width:100%;height:100%;object-fit:cover;display:block}
.mthumb .vthumb{height:100%}
.mthumb .x2{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.62);color:#fff;font-weight:800;font-size:1.1rem;line-height:1}
.mthumb .cover{position:absolute;left:4px;bottom:4px;border-radius:8px;padding:2px 8px;font-size:.75rem;font-weight:700;background:var(--am);color:#2a1a00;border:0}
.mthumb .btn-cover{background:rgba(255,255,255,.9);color:var(--ink);min-height:28px}
.vbadge{position:absolute;inset:0;display:grid;place-items:center;color:#fff;pointer-events:none}
.vbadge svg{width:30px;height:30px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.matt{display:grid;gap:6px;margin-top:6px}
.msg .exvideo,.msg .gimg{max-height:300px;border-radius:12px}
.pmedia{display:grid;gap:8px;background:var(--bg);border:1px dashed var(--line);border-radius:14px;padding:10px 12px}
.pmedia .mgrid{grid-template-columns:repeat(auto-fill,minmax(80px,1fr))}
.sent{justify-self:end;color:var(--mut);display:flex;gap:4px;align-items:center}
.demo{display:grid;gap:8px}
.dctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pbody .kpis,.sheet .kpis{grid-template-columns:1fr 1fr}
.pbody .kpi strong{font-size:1.7rem}
.ctagrid{display:grid;grid-template-columns:1.25fr 1fr;gap:8px}
.ctagrid .btn{font-size:1rem}
.remline{display:flex;gap:8px;align-items:center;border:0;background:none;padding:2px 4px;color:var(--mut);font-size:.9rem;text-align:left;min-height:40px}
.remline svg{width:18px;height:18px;flex:none}
.remline span:nth-child(2){flex:1}
.runbar{display:flex;gap:4px}
.runbar i{flex:1;height:6px;border-radius:6px;background:var(--line)}
.runbar i.on{background:var(--ok)}.runbar i.cur{background:var(--t)}
.runbox{display:grid;gap:10px;justify-items:center;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.runbox.rest{background:var(--tl)}
.setrows{display:grid;gap:6px}
.setrow{display:grid;grid-template-columns:4em auto auto 1fr;gap:10px;align-items:center}
.setrow .x3{justify-self:end;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--mut);font-size:1.1rem}
.setdots{display:flex;gap:8px;justify-content:center}
.setdots i{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:var(--card)}
.setdots i.cur{border-color:var(--t);box-shadow:0 0 0 3px var(--tl2)}
.setdots i.on{background:var(--ok);border-color:var(--ok);color:#fff}
.setdots svg{width:16px;height:16px}
@keyframes flash{from{background:var(--oks)}to{background:var(--card)}}
.runbox.flash{animation:flash .6s ease-out}
@media(prefers-reduced-motion:reduce){.runbox.flash{animation:none}}
.setlbl{font-weight:800;font-size:1.05rem;color:var(--t)}
.rbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.rbtns .btn{min-width:130px}
.runbox .clock.done{color:var(--ok)}
.runbox .clock{font-size:3.2rem;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.runbox .clock small{font-size:1.1rem;font-weight:700;color:var(--mut)}
.runbox .btn.full{width:100%}
.runend{display:grid;justify-items:center;text-align:center;gap:8px;padding:20px 0}
.bigcheck{width:76px;height:76px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center}
.bigcheck svg{width:40px;height:40px}
.switch{width:56px;height:32px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none;padding:0}
.switch i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.switch[aria-checked=true]{background:var(--ok)}.switch[aria-checked=true] i{left:27px}
.switch.sm{width:48px;height:28px}.switch.sm i{width:22px;height:22px}.switch.sm[aria-checked=true] i{left:23px}
input[type=time]{font-size:1.1rem;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);min-height:48px}
.exvideo{width:100%;max-height:440px;border-radius:16px;background:#000;display:block}
.vwrap{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#0b1514}
.vwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vlink{justify-content:flex-start;flex-wrap:wrap;gap:4px 8px;text-align:left}
.quote{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stepper{display:inline-flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px}
.stepper button{width:44px;height:44px;border-radius:10px;border:0;background:var(--card);font-size:1.35rem;font-weight:700}
.stepper output{min-width:2.6em;text-align:center;font-size:1.2rem;font-weight:800;font-variant-numeric:tabular-nums}
.lex{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.lex:first-of-type{border-top:0}
.lex.flagged{background:var(--ams);border-radius:12px;padding:12px;border:0}
.vas{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px}
@media(max-width:440px){.vas{grid-template-columns:repeat(6,minmax(0,1fr))}}
.vas button{min-height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:800;font-size:1.1rem;box-shadow:inset 0 -5px 0 var(--c)}
.vas button[aria-pressed=true]{background:var(--c);border-color:var(--c);color:#13201a;box-shadow:none;transform:scale(1.06)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{border:0;background:none;border-radius:10px;min-height:46px;font-weight:700;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--t);box-shadow:0 1px 3px rgba(0,0,0,.12)}
textarea,input[type=text],input[type=search],input[type=date]{width:100%;font-size:1rem;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:var(--card)}
textarea{min-height:90px;resize:vertical}
.dinp{max-width:240px;min-height:48px}
label.lab{font-weight:700;display:block;margin-bottom:6px}
details.more summary{cursor:pointer;font-weight:700;color:var(--t);min-height:44px;display:flex;align-items:center}
/* pain module */
.bodymap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
.body{height:auto;max-width:100%;flex:none}
.reg{fill:transparent;stroke:var(--co);stroke-width:2;stroke-dasharray:3 3;cursor:pointer}
.reg:hover{fill:var(--cos)}
.reg[aria-pressed=true]{fill:var(--co);stroke-dasharray:none}
.reg:focus-visible{outline:none;stroke-width:4;stroke-dasharray:none}
.body .lr{font-size:14px;font-weight:800;fill:var(--mut)}
.picker{display:grid;gap:12px;margin-top:10px}
.zoom{display:grid;gap:6px}
.zwrap{display:grid;gap:12px}
.zlist{grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr))}
.zfig{height:min(360px,55vh);width:auto;max-width:100%;justify-self:center;background:var(--tl);border-radius:14px}
.zwrap>.zfig{grid-column:1/-1}
.zone{cursor:pointer}
.zone ellipse{fill:var(--card);fill-opacity:.9;stroke:var(--co);stroke-width:2}
.zone text{fill:var(--co);font-weight:800;pointer-events:none}
.zone[aria-pressed=true] ellipse{fill:var(--co);fill-opacity:1}
.zone[aria-pressed=true] text{fill:#fff}
.zone:focus-visible{outline:none}.zone:focus-visible ellipse{stroke-width:4}
.zlist{display:grid;gap:6px;align-content:start}

<script>
{
/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const TODAY=new Date();TODAY.setHours(12,0,0,0);

const dow=d=>(d.getDay()+6)%7;
const MON=['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];
const MONL=['januari','februari','mars','april','maj','juni','juli','augusti','september','oktober','november','december'];

const fmtL=d=>DAYL[dow(d)]+' '+d.getDate()+' '+MONL[d.getMonth()];

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const hm=t=>{const d=new Date(t);return fmt(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes())};

/* ---------- exercise library ---------- */
const EX=[
{id:'knaboj',name:'Knäböj mot stol',area:'Knä & höft',unit:'rep',pose:'squat',tags:'knä lår säte ben squat böj sitta resa uppresning',steps:['Stå med fötterna axelbrett isär, med en stol bakom dig.','Böj på knän och höft som om du ska sätta dig. Håll ryggen rak.','Nudda stolen lätt med baken och res dig långsamt upp igen.'],tip:'Knäna ska peka åt samma håll som tårna.'},
{id:'knastrack',name:'Sittande knästräckning',area:'Knä & höft',unit:'rep',pose:'kneeExt',tags:'knä lår quadriceps framsida sträck stol sitta',steps:['Sitt långt bak på en stol med båda fötterna i golvet.','Sträck ut ena benet tills det är rakt. Håll i 2 sekunder.','Sänk foten långsamt. Byt ben när du gjort alla repetitioner.'],tip:'Spänn framsidan av låret när benet är rakt.'},
{id:'balans',name:'Balans på ett ben',area:'Knä & höft',unit:'sek',pose:'balance',tags:'balans stabilitet fot fotled knä stå ett ben fall fallprevention',steps:['Stå nära en vägg eller ett bord som du kan ta stöd mot.','Lyft ena foten från golvet och stå stilla på det andra benet.','Håll positionen så länge som angivet. Byt sedan ben.'],tip:'Titta på en fast punkt framför dig, det gör det lättare.'},
{id:'tahavning',name:'Tåhävning',area:'Fot & fotled',unit:'rep',pose:'calf',tags:'vad fot fotled hälsena achilles tå tår',steps:['Stå med fötterna höftbrett isär. Håll lätt i en stolsrygg.','Res dig upp på tå så högt du kan.','Sänk hälarna långsamt ner mot golvet.'],tip:'Gör nedåtrörelsen lugnt, räkna till tre.'},
{id:'bro',name:'Bäckenlyft (bryggan)',area:'Rygg & bål',unit:'rep',pose:'bridge',tags:'rygg ländrygg säte bål höft bro brygga lyft rumpa',steps:['Ligg på rygg med böjda knän och fötterna i golvet.','Spänn magen och lyft bäckenet tills kroppen är rak från knä till axel.','Håll en sekund och sänk långsamt.'],tip:'Pressa genom hälarna, inte tårna.'},

function groupOf(n){if(['Nacke','Övre rygg','Ländrygg'].includes(n))return 'back';const s=sideOf(n);if(!s)return null;return C2G[n.slice(s.length+1)]||null}
function zonesFor(g,side,view){const G=ZG[g];if(!G[view])return [];if(G.mid)return G[view].map(z=>({n:z[0],x:z[1],y:z[2],rx:z[3],ry:z[4]}));

function bodyFig(view,sel,counts,interactive,w){
  const sil=SIL(view)+`<text x="10" y="16" class="lr">${view==='fram'?'H':'V'}</text><text x="150" y="16" class="lr" text-anchor="end">${view==='fram'?'V':'H'}</text>`;
  const max=Math.max(1,...Object.values(counts||{}));let regs='';
  if(interactive){const fineSel=sel.map(a=>ZIDX[a]).filter(Boolean);
    regs=REG[view].map(([n,x,y,rx,ry])=>{const g=groupOf(n),s=sideOf(n);const on=sel.includes(n)||fineSel.some(z=>z.g===g&&(z.side===s||ZG[g].mid));
      return `<ellipse class="reg" cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" role="button" tabindex="0" data-act="${g?'zoomin':'area'}" data-v="${n}" aria-pressed="${on}" aria-label="${g?'Zooma in på ':''}${n}"><title>${n}</title></ellipse>`}).join('');
    regs+=fineSel.filter(z=>z.view===view).map(z=>`<ellipse cx="${z.x}" cy="${z.y}" rx="${Math.max(2.5,z.rx*.8)}" ry="${Math.max(2.5,z.ry*.8)}" fill="var(--co)" stroke="var(--card)" stroke-width="1" pointer-events="none"/>`).join('')}
  else for(const [n,c] of Object.entries(counts||{})){const o=(.3+.7*c/max).toFixed(2);const r=REG[view].find(x=>x[0]===n);
    if(r)regs+=`<ellipse cx="${r[1]}" cy="${r[2]}" rx="${r[3]+2}" ry="${r[4]+2}" fill="var(--co)" opacity="${o}"><title>${n}: ${c}</title></ellipse>`;
    else if(ZIDX[n]&&ZIDX[n].view===view){const z=ZIDX[n];regs+=`<ellipse cx="${z.x}" cy="${z.y}" rx="${z.rx+1.5}" ry="${z.ry+1.5}" fill="var(--co)" opacity="${o}"><title>${n}: ${c}</title></ellipse>`}}
  return `<svg class="body" viewBox="0 0 160 300" width="${w||150}" role="${interactive?'group':'img'}" aria-label="${view==='fram'?'Kroppen framifrån':'Kroppen bakifrån'}">${sil}${regs}</svg>`}
function zoomFig(f){const z=f.zoom,G=ZG[z.g];const view=G[z.view]?z.view:(G.fram?'fram':'bak');const Z=zonesFor(z.g,z.side,view);const b=zbox(z.g,z.side,view);const fs=(b[2]/12).toFixed(2);

  if(lastF&&!p.seenF)h+=`<button class="notice" data-act="ptab" data-v="msg"><span class="av" style="width:40px;height:40px">E</span><span><strong>Nytt från Erik</strong><br><span class="small">${esc(lastF.text.length>80?lastF.text.slice(0,78)+'…':lastF.text)}</span></span>${IC.chev}</button>`;
  h+=`<div class="sec"><h2>Ditt pass</h2><span class="small mut">${prog(p).length} övningar</span></div>`;
  h+=prog(p).map(it=>{const e=EXM[it.ex];const ok=lt&&share(it,lt.items[it.ex])>=.9;return `<button class="exrow" data-act="instr" data-ex="${it.ex}"><div class="pic">${fig(it.ex,true)}</div><div><h3>${esc(e.name)}</h3><div class="dose">${dose(it)}${it.gallery&&it.gallery.length?' · <span style="color:var(--t);font-weight:700">Video från Erik</span>':hasVid(e)?' · <span style="color:var(--t);font-weight:700">Video</span>':''}</div>${pnotes(p,it.ex).length?`<div class="small exnote">${IC.edit.replace('<svg','<svg width="14" height="14"')}<span>${esc(pnotes(p,it.ex).slice(-1)[0].text)}</span></div>`:''}</div><span class="go${ok?' ok':''}" aria-label="${ok?'Gjord i dag':'Visa'}">${ok?IC.check:IC.chev}</span></button>`}).join('');
  if(p.booking)h+=`<div class="card row" style="gap:12px">${'<span class="av">'+IC.phone.replace('<svg','<svg width="20" height="20"')+'</span>'}<div><strong>Telefonmöte med Erik</strong><br><span class="small mut">${esc(p.booking)}</span></div></div>`;

function weekCircles(p){if(!p.since)return '';const s=wkStart(fromKey(p.since)),cur=progWeek(p);let h='';
  for(let w=1;w<=p.weeks;w++){const a=addD(s,(w-1)*7);const c=inRange(p,a,addD(a,6)).length;const pl=wkPlan(p,w);const cls=w>cur?'':w===cur?(c>=pl?'full':'now'):c>=pl?'full':'open';
    const pct=Math.min(100,Math.round(c/pl*100));const lab=`Vecka ${w}: ${w>cur?'kommande':c+' av '+pl+' pass'}`;
    h+=w>cur?`<div><i aria-hidden="true"></i><span>v${w}</span></div>`:`<button class="wkb" data-act="week" data-v="${w}" aria-label="${lab}. Visa sammanställning."><i class="${cls}" style="--p:${pct}">${cls==='full'?IC.check:''}</i><span>v${w}</span></button>`}
  return `<div class="wk">${h}<div><i>${IC.cal.replace('<svg','<svg width="18" height="18"')}</i>Besök</div></div><p class="small mut" style="margin:0">Tryck på en vecka för att se vad du gjorde.</p>`}
function dayCircles(p){const s=wkStart(TODAY);let h='';for(let i=0;i<7;i++){const d=addD(s,i);const k=key(d);const l=logOf(p,k);const cls=l?(vol(p,l)>=.9?'full':'part'):k===TK?'now':'';h+=`<div><i class="${cls}">${l?IC.check:''}</i>${DAY[i]}</div>`}return `<div class="wk">${h}</div>`}
function perExList(p){const a=adherence(p);const L=inRange(p,a.from,TODAY);return prog(p).map(it=>{const v=L.length?Math.round(L.reduce((s,l)=>s+share(it,l.items[it.ex]),0)/L.length*100):null;const fl=L.filter(l=>l.items[it.ex]&&l.items[it.ex].flag).length;
  const t=fl?['co',fl===1?'Flaggad 1 gång':'Flaggad '+fl+' ggr']:v==null?['in','Ingen data']:v>=90?['ok','Gör allt']:['am','Gör '+v+' %'];
  return `<div class="exl"><div class="pic">${fig(it.ex,false)}</div><div><strong>${esc(EXM[it.ex].name)}</strong><br><span class="small mut">${dose(it)}</span></div><span class="tag ${t[0]}">${t[1]}</span></div>`}).join('')}
function pProgress(p){if(!prog(p).length)return `<div class="empty">Här ser du din träning och smärta när du har kommit igång.</div>`;
  const pi=painInfo(p),end=progEnd(p),wleft=p.weeks-progWeek(p);
  const msg=pi?(pi.last.pain>p.painLimit?`Smärtan ligger över din gräns på ${p.painLimit}/10. Ta det lugnare och skriv till Erik om det håller i sig.`:pi.trend>.5?'Smärtan har ökat lite de senaste passen. Håll koll, och skriv till Erik om den fortsätter öka.':pi.trend<-.5?'Smärtan minskar. Det går åt rätt håll!':'Smärtan är ganska stabil.'):'';
  return `<div class="card" style="display:grid;gap:12px"><div class="between"><h2>Vecka ${progWeek(p)} av ${p.weeks}</h2><span class="small" style="color:var(--t);font-weight:700">${wleft>0?wleft+(wleft===1?' vecka kvar':' veckor kvar'):'Sista veckan'}</span></div>${weekCircles(p)}<div class="between small mut"><span>Start ${fmt(fromKey(p.since))}</span><span>Mål ${end?fmt(end):''}</span></div></div>
  <div class="card" style="display:grid;gap:10px"><div class="between"><h3>Den här veckan</h3><span class="small" style="color:var(--t);font-weight:700">${weekDone(p)} av ${p.program.perWeek} pass</span></div>${dayCircles(p)}</div>
  <div class="kpis"><div class="kpi"><span class="ki">${IC.pulse}</span><strong>${adherence(p,28).pct??'–'} %</strong><span class="small mut">Följsamhet, 4 veckor</span></div><div class="kpi"><span class="ki">${IC.check}</span><strong>${p.logs.length}</strong><span class="small mut">Loggade pass</span></div></div>
  <div class="card"><div class="between"><h3>Din utveckling</h3><span class="small mut">Per vecka</span></div><p class="small mut">Staplarna visar dina pass, linjen hur ont du har haft i snitt.</p><div class="fig" data-combo="${p.id}" style="min-height:230px"><svg></svg></div>

function attThumbs(who){const A=(ui.atts&&ui.atts[who])||[];if(!A.length)return '';return `<div class="mgrid">${A.map((a,i)=>`<div class="mthumb">${a.kind==='img'?`<img src="${a.url}" alt="">`:`<video src="${a.url}" muted playsinline></video><span class="vbadge">${PLAY}</span>`}<button class="x2" data-act="attrm" data-who="${who}" data-i="${i}" aria-label="Ta bort">×</button></div>`).join('')}</div>`}

function attention(){const out=[];for(const p of S.order.map(pat)){const pi=painInfo(p);
  const wt=waiting(p);if(wt){const late=replyBy(wt.t)<new Date();out.push([late?'co':'am',IC.chat,`${p.first} väntar på svar`,(late?'<strong style="color:var(--co)">Svarstiden har passerat.</strong> ':'Svara senast '+whenTxt(replyBy(wt.t))+'. ')+(wt.pain?'Med smärtbeskrivning. ':'')+esc(wt.text.slice(0,60)),'Svara',p.id,'msg'])}
  if(pi&&pi.last.pain>p.painLimit)out.push(['co',IC.alert,`${p.first} är över smärtgränsen`,`Senast ${pi.last.pain}/10, gräns ${p.painLimit}/10`,'Justera',p.id,'prog']);
  const f=flags(p,7).filter(x=>x.flag);if(f.length)out.push(['am',IC.flag,`${p.first} har flaggat ${f.length===1?'en övning':f.length+' övningar'}`,[...new Set(f.map(x=>EXM[x.ex].name+': '+x.flag))].slice(0,2).join(', '),'Visa',p.id,'uppf']);
  if(!prog(p).length)out.push(['in',IC.edit,`Skapa program åt ${p.first}`,esc(p.dx),'Skapa',p.id,'prog']);

function tokMatch(q,t){if(t===q)return 1;if(q.length===3&&t.length===3&&q.slice(0,2)===t.slice(0,2))return .5;if(q.length>=3&&t.startsWith(q))return .7;if(t.length>=4&&q.startsWith(t)&&q.length-t.length<=3)return .75;if(q.length>=4&&t.includes(q))return .6;

function fbTable(){const list=(ui.fbList||S.fbLocal).slice().sort((a,b)=>a.t-b.t);const head=['Tid','Roll','Ålder',...TASKS.flatMap(([id])=>[id+' resultat',id+' lätthet']),'Bra','Saknas','Osäker'];

function drawPain(box){const p=pat(box.dataset.chart);const pi=painInfo(p);const s=box.querySelector('svg');if(!pi||!s)return;
  const W=s.clientWidth,H=s.clientHeight;if(!W||!H)return;const m={l:28,r:18,t:16,b:26};const n=28;const start=addD(TODAY,-n);
  const x=k=>m.l+(fromKey(k)-start)/864e5/n*(W-m.l-m.r),y=v=>m.t+(10-v)/10*(H-m.t-m.b);
  const pts=pi.series.filter(l=>fromKey(l.date)>=start);let g='';
  for(const v of [0,5,10])g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${m.l-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  const step=W<420?14:7;for(let i=0;i<=n;i+=step){const d=addD(start,i);g+=`<text x="${x(key(d))}" y="${H-6}" text-anchor="middle">${fmt(d)}</text>`}
  if(pts.length){const path=pts.map((l,i)=>(i?'L':'M')+x(l.date).toFixed(1)+' '+y(l.pain).toFixed(1)).join(' ');
    g+=`<path d="${path} L${x(pts[pts.length-1].date).toFixed(1)} ${y(0)} L${x(pts[0].date).toFixed(1)} ${y(0)}Z" fill="var(--t)" opacity=".12"/><path d="${path}" fill="none" stroke="var(--t)" stroke-width="2.5" stroke-linejoin="round"/>`}
  g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(p.painLimit)}" y2="${y(p.painLimit)}" stroke="var(--am)" stroke-width="2" stroke-dasharray="6 5"/>`;
  if(pts.length){g+=pts.map(l=>`<circle cx="${x(l.date).toFixed(1)}" cy="${y(l.pain).toFixed(1)}" r="${l.pain>p.painLimit?5:3.5}" fill="${l.pain>p.painLimit?'var(--co)':'var(--card)'}" stroke="${l.pain>p.painLimit?'var(--co)':'var(--t)'}" stroke-width="2"><title>${fmt(fromKey(l.date))}: ${l.pain}/10</title></circle>`).join('');
    const L=pts[pts.length-1];g+=`<text x="${Math.min(x(L.date),W-m.r)-8}" y="${y(L.pain)-10}" text-anchor="end" style="fill:${L.pain>p.painLimit?'var(--co)':'var(--t)'};font-weight:800;font-size:14px">${L.pain}/10</text>`}
  s.innerHTML=g}
function weekSeries(p){if(!p.since)return [];const s0=wkStart(fromKey(p.since)),cur=progWeek(p);const out=[];for(let w=1;w<=cur;w++){const a=addD(s0,(w-1)*7);const L=inRange(p,a,addD(a,6));const P=L.filter(l=>l.pain!=null);out.push({w,n:L.length,goal:wkPlan(p,w),pain:P.length?P.reduce((x,l)=>x+l.pain,0)/P.length:null})}return out}
function drawCombo(box){const p=pat(box.dataset.combo);const s=box.querySelector('svg');const W=s.clientWidth,H=s.clientHeight;if(!W||!H)return;const D=weekSeries(p);if(!D.length){s.innerHTML='';return}
  const m={l:34,r:34,t:34,b:26};const maxN=Math.max(p.program.perWeek+1,...D.map(d=>d.n));const bw=(W-m.l-m.r)/D.length;const yN=v=>H-m.b-(v/maxN)*(H-m.t-m.b),yP=v=>m.t+(10-v)/10*(H-m.t-m.b);let g='';
  for(const v of [0,5,10])g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${yP(v)}" y2="${yP(v)}" stroke="var(--line)"/><text x="${W-m.r+6}" y="${yP(v)+4}">${v}</text>`;
  g+=`<text x="${m.l-6}" y="${yN(0)+4}" text-anchor="end">0</text><text x="${m.l-6}" y="${yN(maxN)+4}" text-anchor="end">${maxN}</text><text x="${m.l-6}" y="12" text-anchor="end" style="font-size:11px">Pass</text><text x="${W-m.r+6}" y="12" style="font-size:11px">VAS</text>`;
  D.forEach((d,i)=>{const x=m.l+i*bw+bw*.2,w=bw*.6;g+=`<rect x="${x}" y="${yN(d.n)}" width="${w}" height="${yN(0)-yN(d.n)}" rx="5" fill="var(--t)" opacity="${d.w===D.length?'.55':'.9'}"><title>Vecka ${d.w}: ${d.n} av ${d.goal} pass</title></rect>${d.n?`<text x="${x+w/2}" y="${yN(0)-8}" text-anchor="middle" style="font-weight:800;fill:#fff;stroke:none">${d.n}</text>`:''}<text x="${x+w/2}" y="${H-6}" text-anchor="middle">v${d.w}</text>`});
  g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${yP(p.painLimit)}" y2="${yP(p.painLimit)}" stroke="var(--am)" stroke-width="2" stroke-dasharray="6 5"/>`;
  const pts=D.map((d,i)=>d.pain==null?null:[m.l+i*bw+bw/2,yP(d.pain),d]).filter(Boolean);
  if(pts.length){g+=`<path d="${pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ')}" fill="none" stroke="var(--co)" stroke-width="3" stroke-linejoin="round"/>`+pts.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="5" fill="var(--card)" stroke="var(--co)" stroke-width="2.5"><title>Vecka ${q[2].w}: smärta ${q[2].pain.toFixed(1)}</title></circle>`).join('');const L=pts[pts.length-1];g+=`<text x="${L[0]-10}" y="${L[1]-10}" text-anchor="end" style="fill:var(--co);font-weight:800">${L[2].pain.toFixed(1).replace('.',',')}</text>`}
  s.innerHTML=g}

  case 'nxurl':{const v=document.getElementById('nx-url').value.trim();if(!v){toast('Klistra in en länk först.');return}const id=ytId(v);
    if(id)ui.nx.gal.push({kind:'yt',id});else if(/^https:\/\/\S+\.\S+/.test(v))ui.nx.gal.push({kind:'link',url:v});else{toast('Länken ska börja med https://');return}keepScroll(renderModal);toast('Videolänken är tillagd.');break}
  case 'nxrm':{const it=ui.nx.gal.splice(+d.i,1)[0];if(it&&it.blob&&it.url)URL.revokeObjectURL(it.url);keepScroll(renderModal);break}
  case 'nxfirst':{const it=ui.nx.gal.splice(+d.i,1)[0];ui.nx.gal.unshift(it);keepScroll(renderModal);break}
  case 'galgo':{const tr=el.closest('.gal').querySelector('.galtrack');const Lx=tr.scrollLeft+(+d.d)*tr.clientWidth;if(tr.scrollTo)tr.scrollTo({left:Lx,behavior:RM?'auto':'smooth'});else tr.scrollLeft=Lx;break}
  case 'nxset':mod(()=>{ui.nx[d.k]=d.k==='img'?null:d.v});break;
  case 'nxsave':{const n=ui.nx;const steps=n.steps.split('\n').map(x=>x.trim()).filter(Boolean);
    if(!n.name.trim()){toast('Skriv ett namn på övningen.');document.getElementById('nx-name').focus();return}
    if(!steps.length){toast('Skriv minst ett steg under Så gör du.');document.getElementById('nx-steps').focus();return}
    const storeGal=(eid,oldG)=>{const out=n.gal.map((it,i)=>{if(it.blob){const key='m_'+eid+'_'+Date.now().toString(36)+i;VURL[key]=it.url;IDB.put(key,it.blob).catch(()=>toast('En fil kunde inte sparas i den här webbläsaren.'));return {kind:it.kind,key,name:it.name}}const c={...it};delete c.url;return c});
      const keep=new Set(out.map(x=>x.key).filter(Boolean));(oldG||[]).forEach(x=>{if(x.key&&!keep.has(x.key))IDB.del(x.key).catch(()=>{})});return out};
    if(n.id){const e=EXM[n.id];e.gallery=storeGal(n.id,e.gallery);Object.assign(e,{name:cap(n.name.trim()),area:n.area,unit:n.unit,pose:n.pose,steps,tip:n.tip.trim()||'Rör dig lugnt och kontrollerat.',dont:n.dont.trim(),why:n.why.trim(),tags:(n.name+' '+n.area).toLowerCase()});save();ui.modal={type:'exview',ex:e.id};render();toast('Ändringarna är sparade.');break}
    const id='c'+Date.now().toString(36);const e={id,name:cap(n.name.trim()),area:n.area,unit:n.unit,pose:n.pose,steps,tip:n.tip.trim()||'Rör dig lugnt och kontrollerat.',dont:n.dont.trim(),why:n.why.trim(),tags:(n.name+' '+n.area).toLowerCase(),custom:true};e.gallery=storeGal(id,[]);
    S.custom.push(e);EX.push(e);EXM[id]=e;save();ui.modal=null;
    if(ui.draft){ui.draft.items.push({ex:id,sets:3,reps:n.unit==='sek'?30:10,note:''});ui.dirty=true}
    ui.q='';if(!ui.draft&&ui.fpage==='bank')ui.bankTab='egna';render();toast(ui.draft?e.name+' är skapad och tillagd i programmet.':e.name+' är sparad i övningsbanken.');break}
  case 'banktab':ui.bankTab=d.v;render();break;
  case 'exview':ui.modal={type:'exview',ex:d.ex};renderModal();break;
  case 'favm':S.fav=S.fav.includes(d.ex)?S.fav.filter(x=>x!==d.ex):[...S.fav,d.ex];save();keepScroll(render);break;
  case 'bankadd':{const pp=pat(d.id);ui.modal=null;ui.fpid=pp.id;ui.ftab='prog';ui.editI=null;ui.draft=clone(pp.program);ui.draft.weeks=pp.weeks;ui.draft.painLimit=pp.painLimit;const e=EXM[d.ex];ui.draft.items.push({ex:d.ex,sets:3,reps:e.unit==='sek'?30:10,note:''});ui.dirty=true;S.recent=[d.ex,...S.recent.filter(x=>x!==d.ex)].slice(0,8);save();ui.q='';render();window.scrollTo(0,0);toast(e.name+' är tillagd i '+pp.first+'s program. Justera dosen och spara.');break}
  case 'exedit':{const e=EXM[d.ex];ui.nx={id:e.id,name:e.name,area:e.area,unit:e.unit,pose:e.pose||'squat',gal:clone(e.gallery||[]).map(x=>x.key&&VURL[x.key]?{...x,url:VURL[x.key]}:x),steps:e.steps.join('\n'),tip:e.tip||'',dont:e.dont||'',why:e.why||''};ui.modal={type:'newex'};renderModal();break}
  case 'exdel':{const U=usedBy(d.ex);if(U.length){toast('Övningen används hos '+U.map(p=>p.first).join(', ')+'. Ta bort den från programmet först.');return}((EXM[d.ex]&&EXM[d.ex].gallery)||[]).forEach(x=>{if(x.key)IDB.del(x.key).catch(()=>{})});const i=EX.findIndex(e=>e.id===d.ex);if(i>=0)EX.splice(i,1);S.custom=S.custom.filter(e=>e.id!==d.ex);S.fav=S.fav.filter(x=>x!==d.ex);delete EXM[d.ex];save();ui.modal=null;render();toast('Övningen är borttagen.');break}
  case 'facet':{const A=ui.fac[d.k];ui.fac[d.k]=A.includes(d.v)?A.filter(x=>x!==d.v):[...A,d.v];ui.facOpen=true;keepScroll(render);break}
  case 'libclear':ui.q='';ui.area='Alla';ui.fac={pos:[],eq:[],lvl:[],goal:[]};keepScroll(render);break;
  case 'fav':{S.fav=S.fav.includes(d.ex)?S.fav.filter(x=>x!==d.ex):[...S.fav,d.ex];save();const y=document.getElementById('lib').scrollTop;document.getElementById('lib').innerHTML=libList();document.getElementById('lib').scrollTop=y;toast(S.fav.includes(d.ex)?EXM[d.ex].name+' är en favorit.':'Borttagen från favoriter.');break}
  case 'dswap':{const it=ui.draft.items[+d.i];if(ui.draft.items.some(x=>x.ex===d.ex)){toast(EXM[d.ex].name+' finns redan i programmet.');return}const old=EXM[it.ex],nw=EXM[d.ex];if(old.unit!==nw.unit)it.reps=nw.unit==='sek'?30:10;it.ex=d.ex;delete it.steps;delete it.tip;ui.editI=null;dr();toast('Bytt till '+nw.name+'.');break}
  case 'dremove':ui.draft.items=ui.draft.items.filter(x=>x.ex!==d.ex);dr();break;
  case 'drm':ui.draft.items.splice(+d.i,1);ui.editI=null;dr();break;
  case 'dmove':{const I=ui.draft.items,i=+d.i,j=i+(+d.d);if(j<0||j>=I.length)return;[I[i],I[j]]=[I[j],I[i]];dr();break}
  case 'dstep':{const it=ui.draft.items[+d.i];const sek=EXM[it.ex].unit==='sek';it[d.f]=Math.max(1,Math.min(d.f==='sets'?10:300,it[d.f]+(+d.d)*(d.f==='reps'&&sek?5:1)));dr();break}
  case 'dedit':ui.editI=ui.editI===+d.i?null:+d.i;keepScroll(render);break;
  case 'dorig':{const it=ui.draft.items[+d.i];delete it.steps;delete it.tip;dr();break}
  case 'tpl':{const T=TPL[+d.i],D=ui.draft;if(!D.items.length)D.perWeek=T.perWeek;let n=0;for(const [ex,se,re] of T.items)if(!D.items.some(x=>x.ex===ex)){D.items.push({ex,sets:se,reps:re,note:''});n++}dr();toast(n?'Mallen '+T.name.toLowerCase()+' är tillagd. Justera vid behov.':'Övningarna finns redan i programmet.');break}
  case 'dundo':ui.draft=null;ui.editI=null;render();break;
  case 'dsave':{const D=ui.draft;p.program={perWeek:D.perWeek,items:D.items};p.weeks=D.weeks;p.painLimit=D.painLimit;if(!p.since)p.since=TK;p.msgs.push({from:'f',text:'Hej '+p.first+'! Jag har uppdaterat ditt träningsprogram: '+perWk(D.perWeek)+' i '+D.weeks+' veckor. Du hittar övningarna under Idag.',t:Date.now()});p.seenF=false;ui.draft=null;ui.dirty=false;ui.editI=null;save();render();toast('Programmet är skickat till '+p.first+'.');break}
  case 'farea':ui.area=d.v;document.querySelectorAll('[data-act=farea]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===ui.area));document.getElementById('lib').innerHTML=libList();break;
  case 'fsend':{const t=document.getElementById('ftext').value.trim();const AT=(ui.atts&&ui.atts.f)||[];if(!t&&!AT.length)return;p.msgs.push({from:'f',text:t,t:Date.now(),att:AT.length?AT.map(a=>({kind:a.kind,key:a.key,name:a.name})):null});ui.atts.f=[];p.seenF=false;save();render();toast('Svar skickat.');break}
  case 'fcall':p.msgs.push({from:'f',text:'Jag ringer upp dig så pratar vi om det.',t:Date.now()});p.seenF=false;save();render();toast('Svar skickat. Kom ihåg att ringa '+p.first+'.');break;
  case 'prm':{const G=ui.draft.items[+d.i].gallery;G.splice(+d.j,1);dr();break}
  case 'purl':{const v=document.getElementById('pu'+d.i).value.trim();const it=ui.draft.items[+d.i];const id=ytId(v);if(id)(it.gallery=it.gallery||[]).push({kind:'yt',id});else if(/^https:\/\/\S+\.\S+/.test(v))(it.gallery=it.gallery||[]).push({kind:'link',url:v});else{toast('Klistra in en länk som börjar med https://');return}dr();toast('Videon är tillagd. Glöm inte att spara programmet.');break}
  case 'jopt':ui.jopt[d.k]=!ui.jopt[d.k];keepScroll(renderModal);break;
  case 'fnadd':{const t=document.getElementById('fnote').value.trim();if(!t){toast('Skriv något först.');return}(p.fnotes=p.fnotes||[]).push({text:t,t:Date.now()});save();keepScroll(render);toast('Anteckningen är sparad.');break}
  case 'fndel':p.fnotes.splice(+d.i,1);save();keepScroll(render);break;
  case 'journal':ui.modal={type:'journal'};renderModal();break;
  case 'copy':{const t=document.getElementById(d.src);t.select();(navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>toast('Kopierat.')).catch(()=>{try{document.execCommand('copy');toast('Kopierat.')}catch(e){toast('Markera texten och kopiera manuellt.')}});break}
  case 'fbset':ui.fb[d.k]=ui.fb[d.k]===d.v?null:d.v;keepScroll(render);break;
  case 'fbt':{const t=ui.fb.tasks[d.id]=ui.fb.tasks[d.id]||{};t[d.k]=d.k==='ease'?+d.v:d.v;keepScroll(render);break}
  case 'fbsend':sendFb();break;
  case 'fbcopy':ui.modal={type:'copyfb'};renderModal();break;
  case 'resetask':ui.modal={type:'reset'};renderModal();break;
  case 'doreset':{const fb=S.fbLocal,cu=S.custom,fv=S.fav,rc=S.recent;S=seed();S.fbLocal=fb;S.custom=cu;S.fav=fv;S.recent=rc;save();ui.modal=null;ui.draft=null;ui.dirty=false;ui.composer=false;ui.fpid=null;render();toast('Demodatan är återställd.');break}
  }}
async function sendFb(){const f=ui.fb;const has=f.role||Object.keys(f.tasks).length||f.good||f.miss||f.hard;if(!has){toast('Fyll i något först.');return}
  const id='fb'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);const o={id,t:Date.now(),role:f.role||'',age:f.age||'',tasks:f.tasks,good:f.good||'',miss:f.miss||'',hard:f.hard||''};
  let shared=false;if(ui.db){try{await ui.db.collection('feedback').doc(id).set(o);shared=true}catch(e){}}
  if(!shared){S.fbLocal.push(o);save()}
  ui.fb={tasks:{}};render();window.scrollTo(0,0);toast(shared?'Tack! Din feedback är skickad.':'Tack! Feedbacken är sparad i den här webbläsaren.')}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;act(b.dataset.act,b.dataset,b)});
$modal.addEventListener('click',e=>{if(e.target.classList&&e.target.classList.contains('back')){if(ui.modal&&ui.modal.type==='run')return;stopRun();ui.modal=null;renderModal()}},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')stopRun();if(e.target.id==='q'&&e.key==='Enter'){e.preventDefault();const id=ui.libFirst;if(!id)return;if(ui.libMode==='bank'){act('exview',{ex:id});return}if(ui.draft.items.some(x=>x.ex===id)){toast(EXM[id].name+' finns redan i programmet.');return}ui.q='';act('dadd',{ex:id});const q=document.getElementById('q');if(q){q.value='';q.focus()}return}
  if(e.key==='Escape'&&ui.modal){ui.modal=null;renderModal()}
  const r=e.target.closest&&e.target.closest('[role=button][data-act]');if(r&&(e.key==='Enter'||e.key===' ')){e.preventDefault();r.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
document.addEventListener('input',e=>{const t=e.target;const k=t.dataset&&t.dataset.in;if(!k)return;
  if(k==='q'){ui.q=t.value;document.getElementById('lib').innerHTML=libList()}
  if(k==='dnote'||k==='dsteps'||k==='dtip'){const it=ui.draft.items[+t.dataset.i];if(k==='dnote')it.note=t.value;else if(k==='dtip')it.tip=t.value;else it.steps=t.value.split('\n').map(x=>x.trim()).filter(Boolean);
    if(!ui.dirty){ui.dirty=true;const sb=document.querySelector('[data-act=dsave]');if(sb)sb.disabled=false}}
  if(k==='lognote')ui.form.note=t.value;
  if(k==='rtime'&&t.value){rem(pat(ui.pid)).time=t.value;save();const n=document.querySelector('.sheet .note.in');if(n)n.textContent=remTxt(pat(ui.pid))+'.'}
  if(k==='excom')ui.form.items[t.dataset.ex].comment=t.value;
  if(k==='fb')ui.fb[t.dataset.k]=t.value;
  if(k==='nx')ui.nx[t.dataset.k]=t.value});
document.addEventListener('scroll',e=>{const t=e.target;if(t.classList&&t.classList.contains('galtrack')){const i=Math.round(t.scrollLeft/Math.max(1,t.clientWidth));const c=t.parentElement.querySelector('.galn');if(c)c.textContent=(i+1)+' av '+t.children.length}},true);
document.addEventListener('toggle',e=>{const t=e.target;if(t.classList&&t.classList.contains('more')&&ui.form)ui.form.mapOpen=t.open;if(t.classList&&t.classList.contains('facets'))ui.facOpen=t.open},true);
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='logdate'&&t.value&&ui.form){const k=t.value>TK?TK:t.value;keepScroll(()=>{ui.form=formFor(pat(ui.pid),k);ui.form.other=true;renderModal()})}
  if(t.dataset&&t.dataset.in==='psel'){ui.pid=t.value;ui.composer=false;render()}
  if(t.classList&&t.classList.contains('pmfile')&&t.files&&t.files.length){const it=ui.draft.items[+t.dataset.i];it.gallery=it.gallery||[];let n=0;for(const f of t.files){const img=/^image\//.test(f.type),vid=/^video\//.test(f.type);if(!img&&!vid)continue;if((img&&f.size>15e6)||(vid&&f.size>300e6))continue;const k='pm_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);VURL[k]=URL.createObjectURL(f);IDB.put(k,f).catch(()=>toast('Filen kunde inte sparas i den här webbläsaren.'));it.gallery.push({kind:img?'img':'file',key:k,name:f.name});n++}dr();toast(n?(n===1?'Filen är tillagd.':n+' filer tillagda.')+' Glöm inte att spara programmet.':'Inga filer kunde läggas till.')}
  if((t.id==='nxmedia'||t.id==='nxcam')&&t.files&&t.files.length){let n=0,skip=0;for(const f of t.files){const img=/^image\//.test(f.type),vid=/^video\//.test(f.type);if(!img&&!vid){skip++;continue}if((img&&f.size>15e6)||(vid&&f.size>300e6)){skip++;continue}ui.nx.gal.push({kind:img?'img':'file',blob:f,url:URL.createObjectURL(f),name:f.name||(img?'Foto':'Video')});n++}
    keepScroll(renderModal);toast((n===1?'1 fil tillagd.':n+' filer tillagda.')+(skip?` ${skip} hoppades över (fel format eller för stor).`:''))}
  if(t.classList&&t.classList.contains('chatt')&&t.files&&t.files.length){const who=t.dataset.who;ui.atts=ui.atts||{};const A=ui.atts[who]=ui.atts[who]||[];let n=0,skip=0;
    for(const f of t.files){const img=/^image\//.test(f.type),vid=/^video\//.test(f.type);if(!img&&!vid||(img&&f.size>15e6)||(vid&&f.size>300e6)){skip++;continue}const k='ch_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);const u=URL.createObjectURL(f);VURL[k]=u;IDB.put(k,f).catch(()=>toast('Filen kunde inte sparas i den här webbläsaren.'));A.push({kind:img?'img':'file',key:k,name:f.name||(img?'Bild':'Video'),url:u});n++}
    keepTexts(render);if(skip)toast(skip+' fil'+(skip>1?'er':'')+' hoppades över (fel format eller över 300 MB).')}});
function route(){const h=location.hash.slice(1);ui.view=['patient','fysio','feedback'].includes(h)?h:'start';ui.modal=null;render();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);
route();
(async()=>{try{if(!window.claude||!window.claude.use)return;const db=await window.claude.use('db');if(!db)return;ui.db=db;
  db.collection('feedback').onSnapshot(snap=>{const docs=snap&&snap.docs?snap.docs:Array.isArray(snap)?snap:[];
    ui.fbList=docs.map(x=>typeof x.data==='function'?x.data():(x.data||x)).filter(x=>x&&typeof x==='object');if(ui.view==='feedback'&&!document.activeElement.matches('textarea'))keepScroll(render)},()=>{})}catch(e){}})();
}
